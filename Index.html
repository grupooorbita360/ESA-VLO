<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <?!= include('Stylesheet'); ?>
</head>
<body>

  <!-- Pantalla de inicio: agente + programa + contrato + cliente (obligatorios, el VLO no
       arranca sin esto) + hotel (opcional, solo alimenta el panel "Tips del hotel") -->
  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-idioma">
        <button class="btn-mini" id="btn-idioma-es-lock" onclick="cambiarIdioma('ES')">ES</button>
        <button class="btn-mini" id="btn-idioma-en-lock" onclick="cambiarIdioma('EN')">EN</button>
      </div>
      <h2>Verification Copilot</h2>
      <label data-i18n="labelAgente">Agente</label>
      <select id="sel-agente"><option value="">Cargando...</option></select>
      <label data-i18n="labelPrograma">Programa</label>
      <select id="sel-programa"><option value="">Cargando...</option></select>
      <label data-i18n="labelContrato">Contrato</label>
      <input id="lock-contrato" type="text" data-i18n-placeholder="placeholderContrato">
      <label data-i18n="labelCliente">Cliente</label>
      <input id="lock-cliente" type="text" data-i18n-placeholder="placeholderCliente">
      <label data-i18n="labelHotel">Hotel</label>
      <input id="lock-hotel" type="text" data-i18n-placeholder="placeholderHotel">
      <button id="btn-iniciar" onclick="iniciar()" data-i18n="btnIniciar">Iniciar</button>
    </div>
  </div>

  <!-- App principal -->
  <div id="app" class="app" style="display:none;">

    <header class="topbar">
      <div class="topbar-field"><span class="tb-label" data-i18n="labelAgente">Agente</span><span id="tb-agente">--</span></div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelPrograma">Programa</span><span id="tb-programa">--</span></div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelContrato">Contrato</span>
        <input id="tb-contrato" type="text" data-i18n-placeholder="placeholderContratoTopbar" oninput="onContratoChange(this.value)">
        <button class="btn-mini" onclick="buscarHistorico()" data-i18n="btnBuscar">Buscar</button>
      </div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelCliente">Cliente</span>
        <input id="tb-cliente" type="text" oninput="onVariableChange('CLIENT_NAME', this.value)">
      </div>
      <div class="topbar-field">
        <button class="btn-mini" id="btn-idioma-es" onclick="cambiarIdioma('ES')">ES</button>
        <button class="btn-mini" id="btn-idioma-en" onclick="cambiarIdioma('EN')">EN</button>
      </div>
      <button class="btn-mini btn-danger" onclick="reiniciar()" data-i18n="btnReiniciar">Reiniciar</button>
    </header>

    <div class="body-grid">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content"></main>
      <aside class="right-panel" id="right-panel"></aside>
    </div>
  </div>

  <?!= include('JavaScript'); ?>
</body>
</html>
