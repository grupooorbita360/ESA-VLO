<script>
  // ============================================================
  // Estado en memoria de la llamada. Nada de esto se escribe al
  // Sheet hasta que se llama a guardarLlamada() en Fase 7 (Cierre).
  //
  // Preguntas_USP.Tipo ya fue migrado (ver migracionUnicaMotorVLO en
  // Code.gs) al conjunto cerrado de 8 tipos: SCRIPT, PREGUNTA, LIBRE,
  // CAMPO_PASIVO, EVALUACION_AGENTE, EVALUACION_CONTINUA, ACCION,
  // PANEL_INFO. PANEL_INFO agrupa 4 comportamientos que antes eran tipos
  // separados (panel de oportunidades, calificacion calculada, flags
  // calculados, revision de incidentes) -- como ya no se distinguen por
  // Tipo, subtipoPanelInfo() los reconoce por el contenido fijo de su
  // propio texto. El Checkpoint no es una pantalla fija aparte: es la
  // Fase "Checkpoint - Evaluacion VLO", con sus dos filas PANEL_INFO
  // (calificacion + flags) en su lugar natural del guion.
  // ============================================================
  const state = {
    programa: '',
    agente: '',
    contrato: '',
    cliente: '',
    data: null,          // resultado de getDataInicial(programa)
    respuestas: {},       // Question_ID -> valor contestado
    mostrarOtroPara: {},   // Question_ID -> true mientras se escribe la respuesta de "Otro (especificar)"
    variables: {},        // clave normalizada -> valor (Campos_Variables + topbar)
    continuas: {},         // Question_ID (EVALUACION_CONTINUA) -> estado actual
    incidentes: [],        // [{Incidente_ID, Color, Resolucion, Pendiente}]
    fases: [],
    modoCaptura: null,    // null = flujo continuo; si no, Fase que se esta capturando fuera de orden
    startTime: null,
    reglasDisparadas: [],
    checkpointOverride: null,
    filaCalificacion: null,
    idioma: 'ES',   // 'ES' | 'EN' -- ver TEXTOS / t() / textoFila() mas abajo
    titulosCortos: {},     // Question_ID -> Titulo_Corto (desde Notes_[Programa])
    mostrandoNotas: false, // true mientras se ve la caja de notas VLO/MKT/RED
    llamadaGuardadaOk: false // evita reintentar guardarLlamada() si ya se guardo bien
  };

  // ============================================================
  // Idioma -- dos cosas separadas:
  //  1. TEXTOS/t(): la interfaz que yo escribi (botones, etiquetas, alertas).
  //     Se traduce por completo, vive solo en este archivo.
  //  2. textoFila(): el guion real (Script / Pregunta, Opciones,
  //     Customer_Message) NUNCA se traduce por codigo -- eso violaria la
  //     regla de que ningun texto de guion vive en el codigo. Si el Sheet
  //     agrega una columna paralela "<Columna> (EN)" (ej. "Script / Pregunta
  //     (EN)"), textoFila la usa cuando hay contenido y el idioma activo es
  //     EN; si esa columna no existe o esta vacia para una fila, se sigue
  //     mostrando la columna original sin importar el idioma elegido.
  // ============================================================
  const TEXTOS = {
    ES: {
      labelAgente: 'Agente', labelPrograma: 'Programa', labelContrato: 'Contrato', labelCliente: 'Cliente',
      btnIniciar: 'Iniciar', btnReiniciar: 'Reiniciar', btnBuscar: 'Buscar', btnQuitar: 'Quitar',
      placeholderContrato: 'Numero de contrato', placeholderCliente: 'Nombre del cliente',
      placeholderContratoTopbar: 'Escribe o busca...', placeholderCampoPasivo: 'Se llena solo si surge...', placeholderOtro: 'Especifica...',
      cargando: 'Cargando...', sinProgramas: 'Sin programas activos',
      alertaSeleccionaAgentePrograma: 'Selecciona agente y programa.',
      alertaFaltaContratoCliente: 'Escribe el contrato y el nombre del cliente antes de iniciar -- el VLO no arranca sin esto.',
      alertaCargandoPrograma: 'Los datos del programa todavía están cargando, intenta de nuevo en un momento.',
      confirmReiniciar: '¿Reiniciar la llamada actual? Se perderá lo que no se haya guardado.',
      sinFilas: 'No hay elementos para mostrar en esta fase todavía.',
      capturaBannerTitulo: 'Captura fuera de orden:', capturaBannerSufijo: '. Contesta lo que necesites y vuelve al flujo normal.',
      volverAlFlujo: '← Volver al flujo', chipOtro: 'Otro (especificar)', ejecutar: 'Ejecutar',
      evaluandoReglas: 'Evaluando reglas...', evaluando: 'Evaluando...', flagsDetectadosTitulo: 'Flags detectados',
      oportunidadesTitulo: 'Oportunidades identificadas en esta llamada',
      oportunidadSeguro: 'No viaja asegurado -- ofrecer SafeKit/Propack.',
      oportunidadTransporte: 'Transporte sin resolver -- ofrecer upgrade.',
      oportunidadActividades: 'Sin actividades definidas -- ofrecer recomendaciones.',
      sinOportunidades: 'Sin oportunidades detectadas -- se puede pasar directo a Cierre.',
      agregarIncidente: 'Agregar incidente...', sinIncidentes: 'Sin incidentes registrados en esta llamada.',
      sinReglaBadge: 'Sin regla disparada', razonInterna: 'Razón interna:', validacionEsa: 'Validación ESA:',
      siguienteAccion: 'Siguiente acción:', sinReglaTexto: 'Ninguna regla se disparó con las respuestas actuales.',
      labelAjusteCalificacion: 'Confirmar o ajustar calificación', sinFlagsDetectados: 'Sin flags detectados.',
      tituloProgreso: 'Progreso de la llamada', sufijoProgreso: '% completado',
      tituloEvalContinua: 'Evaluación continua', sinIndicadores: 'Sin indicadores continuos.', clickParaCambiar: 'click para cambiar',
      tituloResumen: 'Resumen en vivo', sinRespuestas: 'Todavía no hay respuestas.',
      llamadaGuardada: 'Llamada guardada correctamente.', problemaGuardar: 'Hubo un problema al guardar: ',
      alertaContratoVacio: 'Escribe un número de contrato para buscar.', sinHistorico: 'No se encontró historial para ese contrato.',
      historicoTitulo: 'Última llamada registrada:', historicoFecha: 'Fecha:', historicoPrograma: 'Programa:',
      historicoAgente: 'Agente:', historicoCalificacion: 'Calificación:', historicoIncidentesNum: 'Incidentes:',
      historicoIncidentesTitulo: 'Incidentes registrados:',
      tituloPuntosCriticos: 'Puntos críticos', sinPuntosCriticos: 'Sin puntos críticos definidos en el Sheet.',
      btnFinalizarLlamada: 'Finalizar llamada', tituloNotas: 'Notas de la llamada',
      btnCopiar: 'Copiar al portapapeles', copiado: '¡Copiado!', sinNotasCategoria: '(Sin notas para esta categoría)',
      guardando: 'Guardando...'
    },
    EN: {
      labelAgente: 'Agent', labelPrograma: 'Program', labelContrato: 'Contract', labelCliente: 'Client',
      btnIniciar: 'Start', btnReiniciar: 'Restart', btnBuscar: 'Search', btnQuitar: 'Remove',
      placeholderContrato: 'Contract number', placeholderCliente: 'Client name',
      placeholderContratoTopbar: 'Type or search...', placeholderCampoPasivo: 'Only fill in if it comes up...', placeholderOtro: 'Specify...',
      cargando: 'Loading...', sinProgramas: 'No active programs',
      alertaSeleccionaAgentePrograma: 'Select agent and program.',
      alertaFaltaContratoCliente: 'Enter the contract number and client name before starting -- the VLO will not start without this.',
      alertaCargandoPrograma: 'Program data is still loading, try again in a moment.',
      confirmReiniciar: 'Restart the current call? Anything not saved will be lost.',
      sinFilas: 'Nothing to show for this phase yet.',
      capturaBannerTitulo: 'Out-of-order capture:', capturaBannerSufijo: '. Answer what you need and return to the normal flow.',
      volverAlFlujo: '← Back to flow', chipOtro: 'Other (specify)', ejecutar: 'Run',
      evaluandoReglas: 'Evaluating rules...', evaluando: 'Evaluating...', flagsDetectadosTitulo: 'Flags detected',
      oportunidadesTitulo: 'Opportunities identified in this call',
      oportunidadSeguro: 'Not traveling with protection -- offer SafeKit/Propack.',
      oportunidadTransporte: 'Transportation not resolved -- offer upgrade.',
      oportunidadActividades: 'No activities defined -- offer recommendations.',
      sinOportunidades: 'No opportunities detected -- can move straight to Closing.',
      agregarIncidente: 'Add incident...', sinIncidentes: 'No incidents logged for this call.',
      sinReglaBadge: 'No rule triggered', razonInterna: 'Internal reason:', validacionEsa: 'ESA validation:',
      siguienteAccion: 'Next action:', sinReglaTexto: 'No rule was triggered with the current answers.',
      labelAjusteCalificacion: 'Confirm or adjust rating', sinFlagsDetectados: 'No flags detected.',
      tituloProgreso: 'Call progress', sufijoProgreso: '% complete',
      tituloEvalContinua: 'Ongoing evaluation', sinIndicadores: 'No ongoing indicators.', clickParaCambiar: 'click to change',
      tituloResumen: 'Live summary', sinRespuestas: 'No answers yet.',
      llamadaGuardada: 'Call saved successfully.', problemaGuardar: 'There was a problem saving: ',
      alertaContratoVacio: 'Enter a contract number to search.', sinHistorico: 'No history found for that contract.',
      historicoTitulo: 'Last call on record:', historicoFecha: 'Date:', historicoPrograma: 'Program:',
      historicoAgente: 'Agent:', historicoCalificacion: 'Rating:', historicoIncidentesNum: 'Incidents:',
      historicoIncidentesTitulo: 'Logged incidents:',
      tituloPuntosCriticos: 'Critical points', sinPuntosCriticos: 'No critical points defined in the Sheet.',
      btnFinalizarLlamada: 'Finish call', tituloNotas: 'Call notes',
      btnCopiar: 'Copy to clipboard', copiado: 'Copied!', sinNotasCategoria: '(No notes for this category)',
      guardando: 'Saving...'
    }
  };

  function t(clave) {
    const dict = TEXTOS[state.idioma] || TEXTOS.ES;
    return dict[clave] !== undefined ? dict[clave] : (TEXTOS.ES[clave] || clave);
  }

  // Ver comentario grande arriba: NUNCA traduce nada por su cuenta, solo lee
  // una columna paralela "<Columna> (EN)" si el Sheet la trae con contenido.
  function textoFila(fila, columna) {
    if (state.idioma === 'EN') {
      const enValor = fila[columna + ' (EN)'];
      if (enValor !== undefined && enValor.toString().trim() !== '') return enValor;
    }
    return fila[columna] || '';
  }

  function cambiarIdioma(idioma) {
    state.idioma = idioma;
    aplicarIdiomaEstatico();
    if (state.data && state.fases.length) renderContent();
  }

  // Traduce el HTML estatico (marcado con data-i18n / data-i18n-placeholder
  // en Index.html) y resalta el boton de idioma activo.
  function aplicarIdiomaEstatico() {
    document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.getAttribute('data-i18n')); });
    document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.getAttribute('data-i18n-placeholder')); });
    ['btn-idioma-es-lock', 'btn-idioma-en-lock', 'btn-idioma-es', 'btn-idioma-en'].forEach(id => {
      const el = document.getElementById(id);
      if (!el) return;
      const esEste = (id.indexOf('-es') !== -1) === (state.idioma === 'ES');
      el.classList.toggle('idioma-activo', esEste);
    });
  }

  document.addEventListener('DOMContentLoaded', () => {
    aplicarIdiomaEstatico();
    google.script.run.withSuccessHandler(onProgramasCargados).withFailureHandler(onError).getProgramasActivos();
  });

  function onError(err) {
    console.error(err);
    alert('Error: ' + (err && err.message ? err.message : err));
  }

  // ---- Carga inicial (lock screen) ----

  function onProgramasCargados(programas) {
    state.programasActivos = programas || [];
    const sel = document.getElementById('sel-programa');
    sel.innerHTML = '';
    if (!state.programasActivos.length) {
      sel.innerHTML = '<option value="">' + escapeHtml(t('sinProgramas')) + '</option>';
      return;
    }
    state.programasActivos.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p['Product/Program'];
      opt.textContent = p['Product/Program'];
      sel.appendChild(opt);
    });
    sel.onchange = () => cargarDatosPrograma(sel.value);
    cargarDatosPrograma(sel.value);
  }

  function cargarDatosPrograma(programa) {
    const selAgente = document.getElementById('sel-agente');
    selAgente.innerHTML = '<option value="">' + escapeHtml(t('cargando')) + '</option>';
    google.script.run.withSuccessHandler(onDataInicial).withFailureHandler(onError).getDataInicial(programa);
  }

  function onDataInicial(data) {
    if (data && data.error) { onError(data.error); return; }
    state.data = data;
    state.titulosCortos = construirMapaTitulosCortos();
    const selAgente = document.getElementById('sel-agente');
    selAgente.innerHTML = '';
    (data.agentes || []).forEach(nombre => {
      const opt = document.createElement('option');
      opt.value = nombre;
      opt.textContent = nombre;
      selAgente.appendChild(opt);
    });
  }

  function iniciar() {
    const agente = document.getElementById('sel-agente').value;
    const programa = document.getElementById('sel-programa').value;
    const contrato = document.getElementById('lock-contrato').value.trim();
    const cliente = document.getElementById('lock-cliente').value.trim();
    if (!agente || !programa) { alert(t('alertaSeleccionaAgentePrograma')); return; }
    if (!contrato || !cliente) { alert(t('alertaFaltaContratoCliente')); return; }
    if (!state.data || !state.data.config || state.data.config['Product/Program'] !== programa) {
      alert(t('alertaCargandoPrograma'));
      return;
    }
    state.agente = agente;
    state.programa = programa;
    state.contrato = contrato;
    state.cliente = cliente;
    state.variables['CONTRATO'] = contrato;
    state.variables['CLIENT_NAME'] = cliente;
    state.startTime = Date.now();
    document.getElementById('tb-agente').textContent = agente;
    document.getElementById('tb-programa').textContent = programa;
    document.getElementById('tb-contrato').value = contrato;
    document.getElementById('tb-cliente').value = cliente;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildSidebar();
  }

  // Los Web Apps de Apps Script sirven el contenido dentro de un iframe --
  // recargar ese iframe directo (location.reload) puede dejarlo en blanco.
  // Navegar la ventana de arriba (top) fuerza una carga limpia desde cero.
  function reiniciar() {
    if (!confirm(t('confirmReiniciar'))) return;
    top.location.href = top.location.href;
  }

  // ---- Utilidades ----

  function normalizeKey(str) {
    return (str || '').toString().toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '_');
  }

  function esVerdadero(v) {
    if (v === true) return true;
    const t = (v || '').toString().trim().toUpperCase();
    return t === 'TRUE' || t === 'SI' || t === 'YES';
  }

  function escapeHtml(s) {
    return (s || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Opciones viene como lista separada por "|" o "," segun la fila.
  function separarOpciones(str) {
    if (!str) return [];
    const sep = str.toString().indexOf('|') !== -1 ? '|' : ',';
    return str.toString().split(sep).map(s => s.trim()).filter(Boolean);
  }

  // Detecta el color de un texto de resultado por su emoji (🟢/🟠/🔴/⚠️).
  function colorDeTexto(texto) {
    if (!texto) return '';
    if (texto.indexOf('🔴') !== -1) return 'red';
    if (texto.indexOf('🟠') !== -1) return 'orange';
    if (texto.indexOf('⚠️') !== -1) return 'orange';
    if (texto.indexOf('🟢') !== -1) return 'green';
    return '';
  }

  // Para EVALUACION_CONTINUA, cuyas Opciones son palabras planas (Verde/Naranja/Rojo).
  function colorPorNombre(nombre) {
    const t = (nombre || '').toString().toLowerCase();
    if (t.indexOf('rojo') !== -1) return 'red';
    if (t.indexOf('naranja') !== -1) return 'orange';
    return 'green';
  }

  // El texto de "Script / Pregunta" en EVALUACION_CONTINUA es la instruccion
  // completa de cuando cambiar el semaforo (para el tooltip), no una etiqueta
  // para mostrar. La etiqueta corta sale del Question_ID (ej. EVAL_IDIOMA -> Idioma).
  function etiquetaCorta(questionId) {
    if (!questionId) return '';
    return questionId.toString()
      .replace(/^EVAL_/, '')
      .split('_')
      .filter(Boolean)
      .map(palabra => palabra.charAt(0) + palabra.slice(1).toLowerCase())
      .join(' ');
  }

  function obtenerVariable(nombre) {
    const key = normalizeKey(nombre);
    if (state.variables[key] !== undefined && state.variables[key] !== '') return state.variables[key];
    const qid = Object.keys(state.respuestas).find(k => normalizeKey(k) === key);
    if (qid !== undefined && state.respuestas[qid] !== '') return state.respuestas[qid];
    return undefined;
  }

  // Reemplaza {{Variable}} por su valor actual; si falta, marca el hueco
  // en vez de fallar en silencio -- el agente necesita notar qué falta.
  function interpolar(texto) {
    const conSaltos = escapeHtml(texto).replace(/\n/g, '<br>');
    return conSaltos.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, nombre) => {
      const valor = obtenerVariable(nombre);
      if (valor === undefined) return '<span class="var-missing">[' + escapeHtml(nombre.trim()) + ']</span>';
      return escapeHtml(valor);
    });
  }

  // Solo reconoce el formato documentado "Question_ID: Valor" (con "Y" como AND).
  // Algunas filas del guion real usan texto libre en Mostrar_Si (p.ej. "Cliente
  // divorciada", "Sigue diciendo No") que no sigue ese formato -- esas cláusulas
  // no tienen forma de evaluarse automáticamente y se tratan como cumplidas.
  function cumpleMostrarSi(condicion) {
    if (!condicion) return true;
    const partes = condicion.toString().split(/\sY\s/i).map(s => s.trim()).filter(Boolean);
    return partes.every(cond => {
      const idx = cond.indexOf(':');
      if (idx === -1) return true;
      const qid = cond.slice(0, idx).trim();
      const esperado = cond.slice(idx + 1).trim();
      const real = state.respuestas[qid] !== undefined ? state.respuestas[qid] : state.continuas[qid];
      if (real === undefined) return false;
      return real.toString().trim().toUpperCase() === esperado.toUpperCase();
    });
  }

  // ---- Tipos de contenido ----
  // Conjunto cerrado de 8 tipos (post-migracion) -- solo normaliza mayusculas/espacios.

  function tipoCategoria(tipo) {
    return (tipo || '').toString().trim().toUpperCase();
  }

  // ---- Sidebar / Fases ----
  //
  // El guion NO se navega por pestañas: las preguntas van apareciendo solas,
  // una tras otra, en una sola columna continua (renderFlujoContinuo). La
  // fila que requiere una respuesta para poder avanzar (PREGUNTA /
  // EVALUACION_AGENTE sin contestar) detiene el avance ahi -- lo de abajo
  // simplemente no aparece todavia. El sidebar es solo un atajo: si la
  // llamada se sale de contexto, el agente puede saltar a cualquier fase
  // para capturar algo fuera de orden, y despues volver al flujo normal
  // justo donde se habia quedado.

  function buildSidebar() {
    const fases = [];
    (state.data.preguntas || []).forEach(p => {
      if (p.Fase && !fases.includes(p.Fase)) fases.push(p.Fase);
    });
    state.fases = fases;
    state.modoCaptura = null;
    renderContent();
  }

  // La condicion de entrada de una fase completa se resuelve en codigo,
  // nunca como fila de Preguntas_ (ej. Servicios solo si CONFIG_PRODUCTS.Services = YES).
  function faseHabilitada(fase) {
    const key = normalizeKey(fase);
    if (key.indexOf('SERVICIO') !== -1) return esVerdadero(state.data.config.Services);
    return true;
  }

  function renderSidebarNav() {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    const destacada = state.modoCaptura || faseActual();
    state.fases.filter(faseHabilitada).forEach(fase => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (fase === destacada ? ' active' : '');
      btn.textContent = fase;
      btn.onclick = () => irAFaseFueraDeOrden(fase);
      sidebar.appendChild(btn);

      // Preguntas de esa fase desglosadas -- tachadas si ya se contestaron,
      // clic salta directo a esa pregunta (fuera de orden si hace falta).
      const preguntasFase = (state.data.preguntas || [])
        .filter(p => p.Fase === fase && (tipoCategoria(p.Tipo) === 'PREGUNTA' || tipoCategoria(p.Tipo) === 'EVALUACION_AGENTE'))
        .sort((a, b) => (Number(a.Orden) || 0) - (Number(b.Orden) || 0));

      preguntasFase.forEach(fila => {
        const contestada = state.respuestas[fila.Question_ID] !== undefined;
        const sub = document.createElement('button');
        sub.className = 'nav-subitem' + (contestada ? ' contestada' : '');
        sub.textContent = (contestada ? '✓ ' : '') + truncar(textoFila(fila, 'Script / Pregunta'), 40);
        sub.onclick = () => irAPreguntaFueraDeOrden(fase, fila.Question_ID);
        sidebar.appendChild(sub);
      });
    });
  }

  function truncar(texto, max) {
    const t = (texto || '').toString().trim();
    return t.length > max ? t.slice(0, max - 1) + '…' : t;
  }

  function irAFaseFueraDeOrden(fase) {
    state.modoCaptura = fase;
    renderContent();
  }

  function irAPreguntaFueraDeOrden(fase, questionId) {
    state.modoCaptura = fase;
    renderContent();
    requestAnimationFrame(() => {
      const el = document.getElementById('q-' + normalizeKey(questionId));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  function volverAlFlujo() {
    state.modoCaptura = null;
    renderContent();
  }

  // ---- Contenido: flujo continuo o captura fuera de orden ----

  function renderContent() {
    if (state.mostrandoNotas) return; // la caja de notas ya esta pintada, no se pisa con el flujo
    if (state.modoCaptura) renderCapturaFueraDeOrden();
    else renderFlujoContinuo();
  }

  function todasLasFilasVisibles() {
    return (state.data.preguntas || [])
      .filter(p => p.Fase && faseHabilitada(p.Fase) && tipoCategoria(p.Tipo) !== 'EVALUACION_CONTINUA')
      .sort((a, b) => {
        const fa = state.fases.indexOf(a.Fase), fb = state.fases.indexOf(b.Fase);
        if (fa !== fb) return fa - fb;
        return (Number(a.Orden) || 0) - (Number(b.Orden) || 0);
      })
      .filter(fila => cumpleMostrarSi(fila.Mostrar_Si));
  }

  // Solo PREGUNTA y EVALUACION_AGENTE detienen el avance -- son las que
  // capturan la eleccion de la que dependen los Mostrar_Si posteriores.
  function filaBloquea(fila) {
    const cat = tipoCategoria(fila.Tipo);
    if (cat === 'PREGUNTA' || cat === 'EVALUACION_AGENTE') {
      return state.respuestas[fila.Question_ID] === undefined;
    }
    return false;
  }

  // La fase "actual" es la de la primera pregunta pendiente -- o la ultima
  // fase si ya no queda ninguna (la llamada llego al final del guion).
  function faseActual() {
    const filas = todasLasFilasVisibles();
    for (let i = 0; i < filas.length; i++) {
      if (filaBloquea(filas[i])) return filas[i].Fase;
    }
    return state.fases[state.fases.length - 1];
  }

  // % sobre las preguntas que en este momento son visibles y cuentan como
  // avance real (PREGUNTA / EVALUACION_AGENTE) -- el total baja o sube solo
  // segun las ramas que Mostrar_Si vaya abriendo o cerrando con las respuestas.
  function calcularProgreso() {
    const filas = todasLasFilasVisibles().filter(f => {
      const cat = tipoCategoria(f.Tipo);
      return cat === 'PREGUNTA' || cat === 'EVALUACION_AGENTE';
    });
    if (!filas.length) return 0;
    const contestadas = filas.filter(f => state.respuestas[f.Question_ID] !== undefined).length;
    return Math.round((contestadas / filas.length) * 100);
  }

  function crearEncabezadoFase(fase) {
    const h = document.createElement('div');
    h.className = 'fase-header';
    h.textContent = fase;
    return h;
  }

  function renderFlujoContinuo() {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const filas = todasLasFilasVisibles();

    let faseAnterior = null;
    let necesitaEvaluacion = false;

    for (let i = 0; i < filas.length; i++) {
      const fila = filas[i];
      if (fila.Fase !== faseAnterior) {
        content.appendChild(crearEncabezadoFase(fila.Fase));
        faseAnterior = fila.Fase;
      }

      const el = renderFila(fila);
      if (el) content.appendChild(el);

      if (tipoCategoria(fila.Tipo) === 'PANEL_INFO') {
        const sub = subtipoPanelInfo(fila);
        if (sub === 'CALIFICACION' || sub === 'FLAGS') necesitaEvaluacion = true;
      }

      if (filaBloquea(fila)) break;
    }

    if (necesitaEvaluacion) evaluarYActualizarCheckpoint();

    renderPanel();
    renderSidebarNav();
  }

  function renderCapturaFueraDeOrden() {
    const content = document.getElementById('content');
    content.innerHTML = '';

    const banner = document.createElement('div');
    banner.className = 'captura-banner';
    banner.innerHTML = '<strong>' + escapeHtml(t('capturaBannerTitulo')) + '</strong> ' + escapeHtml(state.modoCaptura) +
      escapeHtml(t('capturaBannerSufijo'));
    content.appendChild(banner);

    const volverBtn = document.createElement('button');
    volverBtn.className = 'btn-mini';
    volverBtn.style.marginBottom = '18px';
    volverBtn.textContent = t('volverAlFlujo');
    volverBtn.onclick = volverAlFlujo;
    content.appendChild(volverBtn);

    const filas = (state.data.preguntas || [])
      .filter(p => p.Fase === state.modoCaptura && tipoCategoria(p.Tipo) !== 'EVALUACION_CONTINUA')
      .sort((a, b) => (Number(a.Orden) || 0) - (Number(b.Orden) || 0))
      .filter(fila => cumpleMostrarSi(fila.Mostrar_Si));

    let necesitaEvaluacion = false;
    filas.forEach(fila => {
      const el = renderFila(fila);
      if (el) content.appendChild(el);
      if (tipoCategoria(fila.Tipo) === 'PANEL_INFO') {
        const sub = subtipoPanelInfo(fila);
        if (sub === 'CALIFICACION' || sub === 'FLAGS') necesitaEvaluacion = true;
      }
    });

    if (!filas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = t('sinFilas');
      content.appendChild(vacio);
    }

    if (necesitaEvaluacion) evaluarYActualizarCheckpoint();

    renderPanel();
    renderSidebarNav();
  }

  function renderFila(fila) {
    switch (tipoCategoria(fila.Tipo)) {
      case 'SCRIPT': return renderScript(fila);
      case 'PREGUNTA': return renderPreguntaOCaptura(fila);
      case 'LIBRE': return renderLibre(fila);
      case 'CAMPO_PASIVO': return renderCampoPasivo(fila);
      case 'EVALUACION_AGENTE': return renderEvaluacionAgente(fila);
      case 'ACCION': return renderAccion(fila);
      case 'PANEL_INFO': return renderPanelInfoDispatch(fila);
      default: return null; // EVALUACION_CONTINUA (panel derecho) y tipos no reconocidos
    }
  }

  function renderAccion(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.textContent = textoFila(fila, 'Script / Pregunta') || fila.Question_ID || t('ejecutar');
    btn.onclick = () => {
      if (fila.Question_ID) state.respuestas[fila.Question_ID] = 'EJECUTADO_' + new Date().toISOString();
      renderPanel();
    };
    div.appendChild(btn);
    return div;
  }

  function renderScript(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'script-text';
    box.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(box);
    return div;
  }

  // Cubre VERIFICACION / EXPLORATORIO / DISCOVERY / PREGUNTA / SONDEO.
  // Sin Opciones, es una captura abierta (misma UI que LIBRE). Siempre se
  // agregan "N/A" y "Otro (especificar)" para cuando ninguna opcion del
  // Sheet aplica al caso real.
  function renderPreguntaOCaptura(fila) {
    // El VALOR guardado en respuestas (y comparado por evaluarReglas contra
    // Answer_Value) siempre es el de la columna base (Opciones), nunca el
    // traducido -- si no, cambiar de idioma a media llamada rompería el
    // motor de reglas. Opciones (EN) solo cambia la ETIQUETA que ve el
    // agente; debe listar sus valores en el mismo orden que Opciones.
    const opcionesBase = separarOpciones(fila.Opciones);
    if (!opcionesBase.length) return renderLibre(fila);
    const opcionesMostradas = separarOpciones(textoFila(fila, 'Opciones'));

    const div = document.createElement('div');
    div.className = 'block';
    div.id = 'q-' + normalizeKey(fila.Question_ID);
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(q);

    const valorActual = state.respuestas[fila.Question_ID];
    const valoresBase = opcionesBase.concat(['N/A']);
    const esValorOtro = valorActual !== undefined && !valoresBase.includes(valorActual);
    const mostrarOtro = !!state.mostrarOtroPara[fila.Question_ID] || esValorOtro;

    const opts = document.createElement('div');
    opts.className = 'options';
    valoresBase.forEach((valorBase, idx) => {
      const etiqueta = valorBase === 'N/A' ? 'N/A' : (opcionesMostradas[idx] || valorBase);
      const chip = document.createElement('button');
      chip.className = 'option-chip' + (valorActual === valorBase ? ' selected' : '');
      chip.textContent = etiqueta;
      chip.onclick = () => {
        delete state.mostrarOtroPara[fila.Question_ID];
        state.respuestas[fila.Question_ID] = valorBase;
        renderContent();
        avanzarDentroDeFase(fila.Fase);
      };
      opts.appendChild(chip);
    });

    const chipOtro = document.createElement('button');
    chipOtro.className = 'option-chip' + (mostrarOtro ? ' selected' : '');
    chipOtro.textContent = t('chipOtro');
    chipOtro.onclick = () => {
      state.mostrarOtroPara[fila.Question_ID] = true;
      if (!esValorOtro) delete state.respuestas[fila.Question_ID];
      renderContent();
    };
    opts.appendChild(chipOtro);
    div.appendChild(opts);

    if (mostrarOtro) {
      const inputOtro = document.createElement('input');
      inputOtro.type = 'text';
      inputOtro.className = 'free-text';
      inputOtro.style.marginTop = '8px';
      inputOtro.placeholder = t('placeholderOtro');
      inputOtro.value = esValorOtro ? valorActual : '';
      inputOtro.oninput = () => {
        if (inputOtro.value.trim()) state.respuestas[fila.Question_ID] = inputOtro.value;
        else delete state.respuestas[fila.Question_ID];
        renderPanel();
      };
      div.appendChild(inputOtro);
    }

    return div;
  }

  function renderLibre(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(q);

    const input = document.createElement('textarea');
    input.className = 'free-text';
    input.rows = 3;
    input.value = state.respuestas[fila.Question_ID] || '';
    input.oninput = () => { state.respuestas[fila.Question_ID] = input.value; renderPanel(); };
    div.appendChild(input);
    return div;
  }

  function renderCampoPasivo(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'passive-field';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = textoFila(fila, 'Script / Pregunta') || fila.Question_ID;
    box.appendChild(label);

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'free-text';
    input.placeholder = t('placeholderCampoPasivo');
    input.value = state.respuestas[fila.Question_ID] || '';
    input.oninput = () => {
      state.respuestas[fila.Question_ID] = input.value;
      state.variables[normalizeKey(fila.Question_ID)] = input.value;
      renderPanel();
    };
    box.appendChild(input);
    div.appendChild(box);
    return div;
  }

  function renderEvaluacionAgente(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    div.id = 'q-' + normalizeKey(fila.Question_ID);
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(q);

    // Mismo criterio que renderPreguntaOCaptura: se guarda siempre el valor
    // base, solo la etiqueta visible cambia de idioma.
    const opcionesBase = separarOpciones(fila.Opciones);
    const opcionesMostradas = separarOpciones(textoFila(fila, 'Opciones'));
    const valorActual = state.respuestas[fila.Question_ID];

    const wrap = document.createElement('div');
    wrap.className = 'eval-agente';
    opcionesBase.forEach((valorBase, idx) => {
      const etiqueta = opcionesMostradas[idx] || valorBase;
      const color = colorDeTexto(etiqueta);
      const claseSel = color === 'red' ? 'sel-red' : color === 'orange' ? 'sel-orange' : color === 'green' ? 'sel-green' : '';
      const btn = document.createElement('button');
      btn.className = 'eval-btn' + (valorActual === valorBase && claseSel ? ' ' + claseSel : '');
      btn.textContent = etiqueta;
      btn.onclick = () => { state.respuestas[fila.Question_ID] = valorBase; renderContent(); avanzarDentroDeFase(fila.Fase); };
      wrap.appendChild(btn);
    });
    div.appendChild(wrap);
    return div;
  }

  // PANEL_INFO agrupa 4 comportamientos que antes eran tipos separados. Como
  // ya no se distinguen por Tipo, se reconocen por el contenido fijo de su
  // propio texto (el de incidentes tambien tiene Question_ID poblado).
  function subtipoPanelInfo(fila) {
    if (fila.Question_ID === 'Q_INCIDENTES_RESUELTOS') return 'INCIDENTES';
    const texto = (fila['Script / Pregunta'] || '').toString().toLowerCase();
    if (texto.indexOf('calificacion sugerida') !== -1 || texto.indexOf('calificación sugerida') !== -1) return 'CALIFICACION';
    if (texto.indexOf('green flags') !== -1 && texto.indexOf('red flags') !== -1) return 'FLAGS';
    if (texto.indexOf('oportunidades identificadas') !== -1) return 'OPORTUNIDADES';
    return 'GENERICO';
  }

  function renderPanelInfoDispatch(fila) {
    switch (subtipoPanelInfo(fila)) {
      case 'INCIDENTES': return renderVerificacionPorIncidente(fila);
      case 'CALIFICACION': return renderCalificacionCalculada(fila);
      case 'FLAGS': return renderFlagsCalculados(fila);
      case 'OPORTUNIDADES': return renderPanelOportunidades(fila);
      default: return renderPanelGenerico(fila);
    }
  }

  function renderPanelGenerico(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'panel-info';
    box.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(box);
    return div;
  }

  function noEsSi(valor) {
    return (valor || '').toString().trim().toUpperCase() !== 'SI';
  }

  // Cuenta como oportunidad: Q_VIAJA_ASEGURADO != Si, Q_TRANSPORTE_RESUELTO != Si,
  // Q_INTERES_ACTIVIDADES = "Todavia no he pensado en eso". La condicion
  // compara siempre contra el valor base guardado (ver renderPreguntaOCaptura).
  function renderPanelOportunidades(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = t('oportunidadesTitulo');
    div.appendChild(label);

    const oportunidades = [];
    if (noEsSi(state.respuestas.Q_VIAJA_ASEGURADO)) {
      oportunidades.push(t('oportunidadSeguro'));
    }
    if (noEsSi(state.respuestas.Q_TRANSPORTE_RESUELTO)) {
      oportunidades.push(t('oportunidadTransporte'));
    }
    if ((state.respuestas.Q_INTERES_ACTIVIDADES || '').toString().trim() === 'Todavia no he pensado en eso') {
      oportunidades.push(t('oportunidadActividades'));
    }

    const box = document.createElement('div');
    if (!oportunidades.length) {
      box.className = 'empty-state';
      box.textContent = t('sinOportunidades');
    } else {
      box.className = 'panel-info';
      oportunidades.forEach(op => {
        const item = document.createElement('div');
        item.className = 'checklist-item';
        item.textContent = op;
        box.appendChild(item);
      });
    }
    div.appendChild(box);
    return div;
  }

  // ---- Incidentes (revision en vivo, subtipo PANEL_INFO/INCIDENTES) ----

  function renderVerificacionPorIncidente(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'question-text';
    label.innerHTML = interpolar(textoFila(fila, 'Script / Pregunta'));
    div.appendChild(label);

    const opcionesResolucion = separarOpciones(textoFila(fila, 'Opciones'));
    const lista = document.createElement('div');
    lista.id = 'lista-incidentes';
    div.appendChild(lista);
    renderListaIncidentes(opcionesResolucion);

    const addWrap = document.createElement('div');
    addWrap.className = 'options';
    addWrap.style.marginTop = '8px';
    const selInc = document.createElement('select');
    selInc.className = 'free-text';
    const vacio = document.createElement('option');
    vacio.value = '';
    vacio.textContent = t('agregarIncidente');
    selInc.appendChild(vacio);
    (state.data.incidentesCatalogo || []).forEach(inc => {
      const opt = document.createElement('option');
      opt.value = inc.Incidente_ID;
      opt.textContent = inc.Incidente_ID + ' — ' + (inc.Descripcion || '');
      selInc.appendChild(opt);
    });
    selInc.onchange = () => {
      if (selInc.value) { agregarIncidente(selInc.value, opcionesResolucion); selInc.value = ''; }
    };
    addWrap.appendChild(selInc);
    div.appendChild(addWrap);
    return div;
  }

  function agregarIncidente(incidenteId, opcionesResolucion) {
    const def = (state.data.incidentesCatalogo || []).find(i => i.Incidente_ID === incidenteId);
    state.incidentes.push({
      Incidente_ID: incidenteId,
      Color: def ? def.Color_Sugerido : '',
      Resolucion: '',
      Pendiente: def ? def.Requiere_Seguimiento : ''
    });
    renderListaIncidentes(opcionesResolucion);
  }

  function quitarIncidente(index, opcionesResolucion) {
    state.incidentes.splice(index, 1);
    renderListaIncidentes(opcionesResolucion);
  }

  function renderListaIncidentes(opcionesResolucion) {
    const container = document.getElementById('lista-incidentes');
    if (!container) return;
    container.innerHTML = '';
    if (!state.incidentes.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = t('sinIncidentes');
      container.appendChild(vacio);
      return;
    }
    state.incidentes.forEach((inc, idx) => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      const texto = document.createElement('span');
      texto.textContent = inc.Incidente_ID + (inc.Color ? ' (' + inc.Color + ')' : '');
      item.appendChild(texto);

      (opcionesResolucion || []).forEach(op => {
        const chip = document.createElement('button');
        chip.className = 'option-chip' + (inc.Resolucion === op ? ' selected' : '');
        chip.textContent = op;
        chip.onclick = () => { inc.Resolucion = op; renderListaIncidentes(opcionesResolucion); };
        item.appendChild(chip);
      });

      const quitar = document.createElement('button');
      quitar.className = 'btn-mini btn-danger';
      quitar.textContent = t('btnQuitar');
      quitar.onclick = () => quitarIncidente(idx, opcionesResolucion);
      item.appendChild(quitar);
      container.appendChild(item);
    });
  }

  // ---- Checkpoint (Fase "Checkpoint - Evaluacion VLO": subtipos CALIFICACION + FLAGS) ----

  function renderCalificacionCalculada(fila) {
    state.filaCalificacion = fila;
    const div = document.createElement('div');
    div.className = 'checkpoint-card';
    div.id = 'calificacion-box';
    div.innerHTML = '<div class="empty-state">' + escapeHtml(t('evaluandoReglas')) + '</div>';
    return div;
  }

  function renderFlagsCalculados(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = textoFila(fila, 'Script / Pregunta') || t('flagsDetectadosTitulo');
    div.appendChild(label);
    const box = document.createElement('div');
    box.id = 'flags-content';
    box.className = 'empty-state';
    box.textContent = t('evaluando');
    div.appendChild(box);
    return div;
  }

  function evaluarYActualizarCheckpoint() {
    state.checkpointOverride = null;
    google.script.run.withSuccessHandler(mostrarCheckpoint).withFailureHandler(onError)
      .evaluarReglas(state.programa, state.respuestas);
  }

  function mostrarCheckpoint(reglasDisparadas) {
    state.reglasDisparadas = reglasDisparadas || [];
    const reglaGanadora = state.reglasDisparadas[0] || null;
    state.checkpointOverride = reglaGanadora ? reglaGanadora.Result : '';
    actualizarCajaCalificacion(reglaGanadora);
    actualizarCajaFlags();
  }

  function actualizarCajaCalificacion(reglaGanadora) {
    const box = document.getElementById('calificacion-box');
    if (!box) return;
    box.innerHTML = '';

    const colorMap = { green: 'var(--green)', orange: 'var(--orange)', red: 'var(--red)' };
    const badge = document.createElement('span');
    badge.className = 'result-badge';
    badge.style.background = colorMap[colorDeTexto(state.checkpointOverride)] || '#9aa4b2';
    badge.style.color = '#fff';
    badge.textContent = state.checkpointOverride || t('sinReglaBadge');
    box.appendChild(badge);

    if (reglaGanadora) {
      const razon = document.createElement('p');
      razon.innerHTML = '<strong>' + escapeHtml(t('razonInterna')) + '</strong> ' + escapeHtml(reglaGanadora.Internal_Reason || '');
      box.appendChild(razon);

      if (reglaGanadora.ESA_Validation && esVerdadero(reglaGanadora.ESA_Validation)) {
        const esa = document.createElement('p');
        esa.innerHTML = '<strong>' + escapeHtml(t('validacionEsa')) + '</strong> ' + escapeHtml(reglaGanadora.ESA_Validation);
        box.appendChild(esa);
      }
      if (reglaGanadora.Customer_Message) {
        const msg = document.createElement('div');
        msg.className = 'script-text';
        msg.innerHTML = interpolar(textoFila(reglaGanadora, 'Customer_Message'));
        box.appendChild(msg);
      }
      if (reglaGanadora.Next_Action) {
        const next = document.createElement('p');
        next.innerHTML = '<strong>' + escapeHtml(t('siguienteAccion')) + '</strong> ' + escapeHtml(reglaGanadora.Next_Action);
        box.appendChild(next);
      }
    } else {
      const sinRegla = document.createElement('p');
      sinRegla.className = 'empty-state';
      sinRegla.textContent = t('sinReglaTexto');
      box.appendChild(sinRegla);
    }

    const ajusteLabel = document.createElement('div');
    ajusteLabel.className = 'block-label';
    ajusteLabel.style.marginTop = '14px';
    ajusteLabel.textContent = t('labelAjusteCalificacion');
    box.appendChild(ajusteLabel);

    // El VALOR guardado (state.checkpointOverride, lo que se manda a
    // guardarLlamada) siempre es el codigo base -- la lista traducida solo
    // cambia la etiqueta que ve el agente en el desplegable.
    const select = document.createElement('select');
    select.className = 'free-text';
    const codigosBase = separarOpciones(state.filaCalificacion ? state.filaCalificacion.Opciones : '');
    const codigosMostrados = separarOpciones(state.filaCalificacion ? textoFila(state.filaCalificacion, 'Opciones') : '');
    codigosBase.forEach((codigo, idx) => {
      const opt = document.createElement('option');
      opt.value = codigo;
      opt.textContent = codigosMostrados[idx] || codigo;
      if (codigo === state.checkpointOverride) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = () => {
      state.checkpointOverride = select.value;
      actualizarCajaCalificacion(reglaGanadora);
    };
    box.appendChild(select);
  }

  // Solo se pueden calcular con certeza los flags que vienen de reglas con
  // Show_Alert -- los Green_Flag/Red_Flag descritos en Notes_[Programa] son
  // referencia para quien mantiene la hoja, no una condicion evaluable.
  function actualizarCajaFlags() {
    const box = document.getElementById('flags-content');
    if (!box) return;
    box.innerHTML = '';
    const conAlerta = (state.reglasDisparadas || []).filter(r => esVerdadero(r.Show_Alert));
    if (!conAlerta.length) {
      box.className = 'empty-state';
      box.textContent = t('sinFlagsDetectados');
      return;
    }
    box.className = '';
    conAlerta.forEach(r => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      item.textContent = (r.Category || r.Rule_ID) + ': ' + (r.Internal_Reason || r.Result);
      box.appendChild(item);
    });
  }

  // ---- Notes_[Programa]: Titulo_Corto, flags automaticos, notas finales ----

  function estaContestada(qid) {
    const v = state.respuestas[qid];
    return v !== undefined && v !== '';
  }

  // Notes_[Programa] marca sus columnas VLO/MKT/RED/Green_Flag/Red_Flag con
  // una "X" literal, no con TRUE/SI/YES como el resto del Sheet.
  function tieneMarca(valor) {
    return (valor || '').toString().trim().toUpperCase() === 'X';
  }

  // "Seccion / Campo" a veces trae varios Question_ID separados por "/"
  // (ej. "Q_PRESENTACION_RECIENTE_DETALLE / Q_MOTIVO_NO_COMPRO").
  function idsDeSeccion(seccion) {
    return (seccion || '').toString().split('/').map(s => s.trim()).filter(Boolean);
  }

  function construirMapaTitulosCortos() {
    const mapa = {};
    (state.data.notes || []).forEach(nota => {
      const titulo = nota.Titulo_Corto;
      if (!titulo) return;
      idsDeSeccion(nota['Seccion / Campo']).forEach(qid => { mapa[qid] = titulo; });
    });
    return mapa;
  }

  function buscarNotaDeQid(qid) {
    return (state.data.notes || []).find(n => idsDeSeccion(n['Seccion / Campo']).includes(qid));
  }

  // Solo los 4 casos donde el Green/Red Flag se puede inferir de una
  // respuesta exacta -- los que dependen de KVC o de EVAL_PREFERRED se
  // quedan fuera a propósito, no se inventa logica para esos. El texto del
  // flag sale de la propia columna Green_Flag/Red_Flag de Notes_USP.
  function detectarFlagsAutomaticos() {
    const condiciones = [
      { qid: 'Q_FRECUENCIA_VIAJE', valor: '5+', columna: 'Green_Flag', tipo: 'green' },
      { qid: 'Q_CONOCE_DESTINO', valor: 'Si', columna: 'Green_Flag', tipo: 'green' },
      { qid: 'Q_OTRO_CLUB', valor: 'Si', columna: 'Green_Flag', tipo: 'green' },
      { qid: 'Q_ACEPTA_PRESENTACION', valor: 'No', columna: 'Red_Flag', tipo: 'red' }
    ];
    const flags = [];
    condiciones.forEach(c => {
      if ((state.respuestas[c.qid] || '').toString().trim().toUpperCase() !== c.valor.toUpperCase()) return;
      const nota = buscarNotaDeQid(c.qid);
      const texto = (nota && nota[c.columna]) ? nota[c.columna] : c.qid;
      flags.push({ tipo: c.tipo, texto: texto });
    });
    return flags;
  }

  // Une, para cada Question_ID ya contestado, "{Titulo_Corto}: {respuesta}"
  // en las categorias (VLO/MKT/RED) donde Notes_USP marco esa fila con "X".
  function generarNotas() {
    const secciones = { VLO: [], MKT: [], RED: [] };
    Object.keys(state.respuestas).forEach(qid => {
      if (!estaContestada(qid)) return;
      const nota = buscarNotaDeQid(qid);
      if (!nota || !nota.Titulo_Corto) return;
      ['VLO', 'MKT', 'RED'].forEach(col => {
        if (tieneMarca(nota[col])) secciones[col].push(nota.Titulo_Corto + ': ' + state.respuestas[qid]);
      });
    });
    return secciones;
  }

  // Patron clasico de Apps Script para copiar al portapapeles: un textarea
  // oculto + execCommand('copy') funciona incluso dentro del iframe
  // sandboxeado del Web App, donde navigator.clipboard puede no tener permiso.
  function copiarAlPortapapeles(texto, boton) {
    const textarea = document.createElement('textarea');
    textarea.value = texto;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    try {
      document.execCommand('copy');
      if (boton) {
        const original = boton.textContent;
        boton.textContent = t('copiado');
        setTimeout(() => { boton.textContent = original; }, 1500);
      }
    } catch (e) {
      alert(texto);
    }
    document.body.removeChild(textarea);
  }

  function renderCajaNotas(secciones) {
    const content = document.getElementById('content');
    content.innerHTML = '';

    const titulo = document.createElement('div');
    titulo.className = 'fase-header';
    titulo.textContent = t('tituloNotas');
    content.appendChild(titulo);

    const estado = document.createElement('div');
    estado.id = 'estado-guardado';
    estado.className = 'empty-state';
    estado.textContent = t('guardando');
    content.appendChild(estado);

    ['VLO', 'MKT', 'RED'].forEach(col => {
      const bloque = document.createElement('div');
      bloque.className = 'block';
      const label = document.createElement('div');
      label.className = 'block-label';
      label.textContent = col;
      bloque.appendChild(label);

      const texto = (secciones[col] || []).join('\n');
      const textarea = document.createElement('textarea');
      textarea.className = 'free-text';
      textarea.rows = 5;
      textarea.readOnly = true;
      textarea.value = texto || t('sinNotasCategoria');
      bloque.appendChild(textarea);

      const copiarBtn = document.createElement('button');
      copiarBtn.className = 'btn-mini';
      copiarBtn.style.marginTop = '6px';
      copiarBtn.textContent = t('btnCopiar');
      copiarBtn.onclick = () => copiarAlPortapapeles(texto, copiarBtn);
      bloque.appendChild(copiarBtn);

      content.appendChild(bloque);
    });

    const volverBtn = document.createElement('button');
    volverBtn.className = 'btn-mini';
    volverBtn.style.marginTop = '18px';
    volverBtn.textContent = t('volverAlFlujo');
    volverBtn.onclick = () => { state.mostrandoNotas = false; renderContent(); };
    content.appendChild(volverBtn);
  }

  // Guarda una sola vez por llamada -- si el agente vuelve a abrir la caja de
  // notas (para copiar algo que se le paso), no se reintenta guardarLlamada().
  function guardarLlamadaAhora() {
    const flags = (state.reglasDisparadas || [])
      .filter(r => esVerdadero(r.Show_Alert))
      .map(r => r.Rule_ID)
      .join(', ');

    const datos = {
      programa: state.programa,
      contrato: state.contrato,
      cliente: state.cliente,
      agente: state.agente,
      duracion: calcularDuracionMinutos(),
      calificacionFinal: state.checkpointOverride || '',
      flags: flags,
      respuestas: state.respuestas,
      incidentes: state.incidentes
    };

    google.script.run.withSuccessHandler(resp => {
      const estado = document.getElementById('estado-guardado');
      if (resp === 'OK') {
        state.llamadaGuardadaOk = true;
        if (estado) estado.textContent = t('llamadaGuardada');
      } else {
        if (estado) estado.textContent = t('problemaGuardar') + resp;
        alert(t('problemaGuardar') + resp);
      }
    }).withFailureHandler(onError).guardarLlamada(datos);
  }

  function abrirFinalizarLlamada() {
    state.mostrandoNotas = true;
    renderCajaNotas(generarNotas());
    if (!state.llamadaGuardadaOk) {
      guardarLlamadaAhora();
    } else {
      const estado = document.getElementById('estado-guardado');
      if (estado) estado.textContent = t('llamadaGuardada');
    }
  }

  // Tras contestar, baja suave hasta la siguiente pregunta pendiente de la
  // MISMA fase -- nunca salta de fase sola, eso lo sigue decidiendo el agente.
  function avanzarDentroDeFase(fase) {
    requestAnimationFrame(() => {
      const pendientes = todasLasFilasVisibles().filter(f => f.Fase === fase && filaBloquea(f));
      if (!pendientes.length) return;
      const el = document.getElementById('q-' + normalizeKey(pendientes[0].Question_ID));
      if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' });
    });
  }

  // ---- Panel derecho ----

  // Orden fijo: Progreso -> Puntos criticos -> Finalizar llamada ->
  // Evaluacion continua -> Resumen en vivo.
  function renderPanel() {
    const panel = document.getElementById('right-panel');
    panel.innerHTML = '';

    renderProgresoEnPanel(panel);
    renderPuntosCriticosEnPanel(panel);
    renderBotonFinalizarEnPanel(panel);
    renderEvaluacionContinuaEnPanel(panel);
    renderResumenEnPanel(panel);
  }

  function renderProgresoEnPanel(panel) {
    const tituloProgreso = document.createElement('div');
    tituloProgreso.className = 'rp-title';
    tituloProgreso.textContent = t('tituloProgreso');
    panel.appendChild(tituloProgreso);

    const progreso = calcularProgreso();
    const barraWrap = document.createElement('div');
    barraWrap.className = 'progreso-wrap';
    const barra = document.createElement('div');
    barra.className = 'progreso-barra';
    barra.style.width = progreso + '%';
    barraWrap.appendChild(barra);
    panel.appendChild(barraWrap);

    const progresoTexto = document.createElement('div');
    progresoTexto.className = 'progreso-texto';
    progresoTexto.textContent = progreso + t('sufijoProgreso');
    panel.appendChild(progresoTexto);
  }

  // "Punto critico" = fila con Critico = SI (columna separada de Obligatorio;
  // Critico marca los puntos de cumplimiento real, no todo lo que bloquea el
  // avance), actualmente visible (respeta Mostrar_Si/Servicios), de un tipo
  // que en verdad se contesta. El Titulo_Corto sale de Notes_USP cuando
  // existe; si no, texto truncado.
  function renderPuntosCriticosEnPanel(panel) {
    const titulo = document.createElement('div');
    titulo.className = 'rp-title';
    titulo.style.marginTop = '18px';
    titulo.textContent = t('tituloPuntosCriticos');
    panel.appendChild(titulo);

    const criticos = todasLasFilasVisibles().filter(f => {
      const cat = tipoCategoria(f.Tipo);
      return esVerdadero(f.Critico) && (cat === 'PREGUNTA' || cat === 'EVALUACION_AGENTE' || cat === 'LIBRE');
    });

    if (!criticos.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = t('sinPuntosCriticos');
      panel.appendChild(vacio);
      return;
    }

    criticos.forEach(fila => {
      const contestada = estaContestada(fila.Question_ID);
      const row = document.createElement('div');
      row.className = 'rp-eval-row';
      const label = document.createElement('span');
      label.textContent = state.titulosCortos[fila.Question_ID] || truncar(textoFila(fila, 'Script / Pregunta'), 30);
      const marca = document.createElement('span');
      marca.className = contestada ? 'punto-critico-ok' : 'punto-critico-pendiente';
      marca.textContent = contestada ? '✓' : '⚠';
      row.appendChild(label);
      row.appendChild(marca);
      panel.appendChild(row);
    });
  }

  // Siempre visible, sin condicion de que el Checkpoint ya este resuelto.
  function renderBotonFinalizarEnPanel(panel) {
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.style.width = '100%';
    btn.style.margin = '4px 0 18px';
    btn.textContent = t('btnFinalizarLlamada');
    btn.onclick = abrirFinalizarLlamada;
    panel.appendChild(btn);
  }

  function renderEvaluacionContinuaEnPanel(panel) {
    const tituloEval = document.createElement('div');
    tituloEval.className = 'rp-title';
    tituloEval.textContent = t('tituloEvalContinua');
    panel.appendChild(tituloEval);

    const continuas = (state.data.preguntas || []).filter(p => tipoCategoria(p.Tipo) === 'EVALUACION_CONTINUA');
    if (!continuas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = t('sinIndicadores');
      panel.appendChild(vacio);
    }
    continuas.forEach(fila => {
      // El VALOR guardado (state.continuas / state.respuestas, comparado por
      // Mostrar_Si) siempre es el de la columna base -- Opciones (EN) solo
      // cambia la etiqueta del tooltip.
      const opcionesBase = separarOpciones(fila.Opciones).map(o => o.replace(/\s*\(default\)\s*/i, '').trim());
      if (!opcionesBase.length) opcionesBase.push('Verde');
      const opcionesMostradas = separarOpciones(textoFila(fila, 'Opciones')).map(o => o.replace(/\s*\(default\)\s*/i, '').trim());
      if (state.continuas[fila.Question_ID] === undefined) state.continuas[fila.Question_ID] = opcionesBase[0];

      const row = document.createElement('div');
      row.className = 'rp-eval-row';
      const label = document.createElement('span');
      label.textContent = etiquetaCorta(fila.Question_ID);
      label.title = textoFila(fila, 'Script / Pregunta'); // el texto largo de instrucciones queda en el tooltip
      const valorBase = state.continuas[fila.Question_ID];
      const idxActual = opcionesBase.indexOf(valorBase);
      const etiquetaValor = (idxActual !== -1 && opcionesMostradas[idxActual]) || valorBase;
      const dot = document.createElement('span');
      dot.className = 'dot dot-' + (colorDeTexto(valorBase) || colorPorNombre(valorBase));
      dot.style.cursor = 'pointer';
      dot.title = etiquetaValor + ' -- ' + t('clickParaCambiar');
      dot.onclick = () => {
        const idx = opcionesBase.indexOf(state.continuas[fila.Question_ID]);
        state.continuas[fila.Question_ID] = opcionesBase[(idx + 1) % opcionesBase.length];
        state.respuestas[fila.Question_ID] = state.continuas[fila.Question_ID];
        renderPanel();
      };
      row.appendChild(label);
      row.appendChild(dot);
      panel.appendChild(row);
    });
  }

  // Solo muestra las respuestas que SI tienen fila en Notes_USP (Titulo_Corto) --
  // si una pregunta contestada no esta mapeada, se omite por completo en vez
  // de mostrarse a medias con su Question_ID crudo. Debajo, los Green/Red
  // Flags que se pueden inferir de una respuesta exacta (ver detectarFlagsAutomaticos).
  function renderResumenEnPanel(panel) {
    const tituloResumen = document.createElement('div');
    tituloResumen.className = 'rp-title';
    tituloResumen.style.marginTop = '18px';
    tituloResumen.textContent = t('tituloResumen');
    panel.appendChild(tituloResumen);

    const respondidasMapeadas = Object.keys(state.respuestas)
      .filter(qid => estaContestada(qid) && state.titulosCortos[qid]);

    if (!respondidasMapeadas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = t('sinRespuestas');
      panel.appendChild(vacio);
    } else {
      respondidasMapeadas.forEach(qid => {
        const item = document.createElement('div');
        item.className = 'checklist-item';
        item.textContent = state.titulosCortos[qid] + ': ' + state.respuestas[qid];
        panel.appendChild(item);
      });
    }

    detectarFlagsAutomaticos().forEach(flag => {
      const item = document.createElement('div');
      item.className = 'checklist-item flag-item flag-' + flag.tipo;
      item.textContent = (flag.tipo === 'green' ? '🟢 ' : '🔴 ') + flag.texto;
      panel.appendChild(item);
    });
  }

  function calcularDuracionMinutos() {
    if (!state.startTime) return 0;
    return Math.round((Date.now() - state.startTime) / 60000);
  }

  // ---- Topbar: contrato / cliente ----

  function onContratoChange(valor) {
    state.contrato = valor;
    state.variables['CONTRATO'] = valor;
  }

  function onVariableChange(key, value) {
    const normKey = normalizeKey(key);
    state.variables[normKey] = value;
    if (normKey === 'CLIENT_NAME') state.cliente = value;
    if (state.data && state.fases.length) renderContent();
  }

  function buscarHistorico() {
    const contrato = document.getElementById('tb-contrato').value.trim();
    if (!contrato) { alert(t('alertaContratoVacio')); return; }
    google.script.run.withSuccessHandler(mostrarHistorico).withFailureHandler(onError).buscarContratoHistorico(contrato);
  }

  function mostrarHistorico(resultado) {
    if (!resultado) { alert(t('sinHistorico')); return; }
    if (typeof resultado === 'string') { alert(resultado); return; }
    const r = resultado.registro;
    let texto = t('historicoTitulo') + '\n' +
      t('historicoFecha') + ' ' + r.Fecha + '\n' + t('historicoPrograma') + ' ' + r.Programa + '\n' + t('historicoAgente') + ' ' + r.Agente +
      '\n' + t('historicoCalificacion') + ' ' + r.Calificacion_Final + '\n' + t('historicoIncidentesNum') + ' ' + r.Num_Incidentes;
    if (resultado.incidentes && resultado.incidentes.length) {
      texto += '\n\n' + t('historicoIncidentesTitulo') + '\n' +
        resultado.incidentes.map(i => '- ' + i.Incidente_ID + ' (' + i.Color + ')').join('\n');
    }
    alert(texto);
  }
</script>
