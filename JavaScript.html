<script>
  // ============================================================
  // Estado en memoria de la llamada. Nada de esto se escribe al
  // Sheet hasta que se llama a guardarLlamada() en Fase 7 (Cierre).
  //
  // Preguntas_USP.Tipo ya fue migrado (ver migracionUnicaMotorVLO en
  // Code.gs) al conjunto cerrado de 8 tipos: SCRIPT, PREGUNTA, LIBRE,
  // CAMPO_PASIVO, EVALUACION_AGENTE, EVALUACION_CONTINUA, ACCION,
  // PANEL_INFO. PANEL_INFO agrupa 4 comportamientos que antes eran tipos
  // separados (panel de oportunidades, calificacion calculada, flags
  // calculados, revision de incidentes) -- como ya no se distinguen por
  // Tipo, subtipoPanelInfo() los reconoce por el contenido fijo de su
  // propio texto. El Checkpoint no es una pantalla fija aparte: es la
  // Fase "Checkpoint - Evaluacion VLO", con sus dos filas PANEL_INFO
  // (calificacion + flags) en su lugar natural del guion.
  // ============================================================
  const state = {
    programa: '',
    agente: '',
    contrato: '',
    cliente: '',
    data: null,          // resultado de getDataInicial(programa)
    respuestas: {},       // Question_ID -> valor contestado
    variables: {},        // clave normalizada -> valor (Campos_Variables + topbar)
    continuas: {},         // Question_ID (EVALUACION_CONTINUA) -> estado actual
    incidentes: [],        // [{Incidente_ID, Color, Resolucion, Pendiente}]
    fases: [],
    modoCaptura: null,    // null = flujo continuo; si no, Fase que se esta capturando fuera de orden
    startTime: null,
    reglasDisparadas: [],
    checkpointOverride: null,
    filaCalificacion: null
  };

  document.addEventListener('DOMContentLoaded', () => {
    google.script.run.withSuccessHandler(onProgramasCargados).withFailureHandler(onError).getProgramasActivos();
  });

  function onError(err) {
    console.error(err);
    alert('Error: ' + (err && err.message ? err.message : err));
  }

  // ---- Carga inicial (lock screen) ----

  function onProgramasCargados(programas) {
    state.programasActivos = programas || [];
    const sel = document.getElementById('sel-programa');
    sel.innerHTML = '';
    if (!state.programasActivos.length) {
      sel.innerHTML = '<option value="">Sin programas activos</option>';
      return;
    }
    state.programasActivos.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p['Product/Program'];
      opt.textContent = p['Product/Program'];
      sel.appendChild(opt);
    });
    sel.onchange = () => cargarDatosPrograma(sel.value);
    cargarDatosPrograma(sel.value);
  }

  function cargarDatosPrograma(programa) {
    const selAgente = document.getElementById('sel-agente');
    selAgente.innerHTML = '<option value="">Cargando...</option>';
    google.script.run.withSuccessHandler(onDataInicial).withFailureHandler(onError).getDataInicial(programa);
  }

  function onDataInicial(data) {
    if (data && data.error) { onError(data.error); return; }
    state.data = data;
    const selAgente = document.getElementById('sel-agente');
    selAgente.innerHTML = '';
    (data.agentes || []).forEach(nombre => {
      const opt = document.createElement('option');
      opt.value = nombre;
      opt.textContent = nombre;
      selAgente.appendChild(opt);
    });
  }

  function iniciar() {
    const agente = document.getElementById('sel-agente').value;
    const programa = document.getElementById('sel-programa').value;
    if (!agente || !programa) { alert('Selecciona agente y programa.'); return; }
    if (!state.data || !state.data.config || state.data.config['Product/Program'] !== programa) {
      alert('Los datos del programa todavía están cargando, intenta de nuevo en un momento.');
      return;
    }
    state.agente = agente;
    state.programa = programa;
    state.startTime = Date.now();
    document.getElementById('tb-agente').textContent = agente;
    document.getElementById('tb-programa').textContent = programa;
    document.getElementById('lock-screen').style.display = 'none';
    document.getElementById('app').style.display = 'block';
    buildSidebar();
  }

  // ---- Utilidades ----

  function normalizeKey(str) {
    return (str || '').toString().toUpperCase()
      .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
      .replace(/[^A-Z0-9]/g, '_');
  }

  function esVerdadero(v) {
    if (v === true) return true;
    const t = (v || '').toString().trim().toUpperCase();
    return t === 'TRUE' || t === 'SI' || t === 'YES';
  }

  function escapeHtml(s) {
    return (s || '').toString()
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  // Opciones viene como lista separada por "|" o "," segun la fila.
  function separarOpciones(str) {
    if (!str) return [];
    const sep = str.toString().indexOf('|') !== -1 ? '|' : ',';
    return str.toString().split(sep).map(s => s.trim()).filter(Boolean);
  }

  // Detecta el color de un texto de resultado por su emoji (🟢/🟠/🔴/⚠️).
  function colorDeTexto(texto) {
    if (!texto) return '';
    if (texto.indexOf('🔴') !== -1) return 'red';
    if (texto.indexOf('🟠') !== -1) return 'orange';
    if (texto.indexOf('⚠️') !== -1) return 'orange';
    if (texto.indexOf('🟢') !== -1) return 'green';
    return '';
  }

  // Para EVALUACION_CONTINUA, cuyas Opciones son palabras planas (Verde/Naranja/Rojo).
  function colorPorNombre(nombre) {
    const t = (nombre || '').toString().toLowerCase();
    if (t.indexOf('rojo') !== -1) return 'red';
    if (t.indexOf('naranja') !== -1) return 'orange';
    return 'green';
  }

  // El texto de "Script / Pregunta" en EVALUACION_CONTINUA es la instruccion
  // completa de cuando cambiar el semaforo (para el tooltip), no una etiqueta
  // para mostrar. La etiqueta corta sale del Question_ID (ej. EVAL_IDIOMA -> Idioma).
  function etiquetaCorta(questionId) {
    if (!questionId) return '';
    return questionId.toString()
      .replace(/^EVAL_/, '')
      .split('_')
      .filter(Boolean)
      .map(palabra => palabra.charAt(0) + palabra.slice(1).toLowerCase())
      .join(' ');
  }

  function obtenerVariable(nombre) {
    const key = normalizeKey(nombre);
    if (state.variables[key] !== undefined && state.variables[key] !== '') return state.variables[key];
    const qid = Object.keys(state.respuestas).find(k => normalizeKey(k) === key);
    if (qid !== undefined && state.respuestas[qid] !== '') return state.respuestas[qid];
    return undefined;
  }

  // Reemplaza {{Variable}} por su valor actual; si falta, marca el hueco
  // en vez de fallar en silencio -- el agente necesita notar qué falta.
  function interpolar(texto) {
    const conSaltos = escapeHtml(texto).replace(/\n/g, '<br>');
    return conSaltos.replace(/\{\{\s*([^}]+?)\s*\}\}/g, (m, nombre) => {
      const valor = obtenerVariable(nombre);
      if (valor === undefined) return '<span class="var-missing">[' + escapeHtml(nombre.trim()) + ']</span>';
      return escapeHtml(valor);
    });
  }

  // Solo reconoce el formato documentado "Question_ID: Valor" (con "Y" como AND).
  // Algunas filas del guion real usan texto libre en Mostrar_Si (p.ej. "Cliente
  // divorciada", "Sigue diciendo No") que no sigue ese formato -- esas cláusulas
  // no tienen forma de evaluarse automáticamente y se tratan como cumplidas.
  function cumpleMostrarSi(condicion) {
    if (!condicion) return true;
    const partes = condicion.toString().split(/\sY\s/i).map(s => s.trim()).filter(Boolean);
    return partes.every(cond => {
      const idx = cond.indexOf(':');
      if (idx === -1) return true;
      const qid = cond.slice(0, idx).trim();
      const esperado = cond.slice(idx + 1).trim();
      const real = state.respuestas[qid] !== undefined ? state.respuestas[qid] : state.continuas[qid];
      if (real === undefined) return false;
      return real.toString().trim().toUpperCase() === esperado.toUpperCase();
    });
  }

  // ---- Tipos de contenido ----
  // Conjunto cerrado de 8 tipos (post-migracion) -- solo normaliza mayusculas/espacios.

  function tipoCategoria(tipo) {
    return (tipo || '').toString().trim().toUpperCase();
  }

  // ---- Sidebar / Fases ----
  //
  // El guion NO se navega por pestañas: las preguntas van apareciendo solas,
  // una tras otra, en una sola columna continua (renderFlujoContinuo). La
  // fila que requiere una respuesta para poder avanzar (PREGUNTA /
  // EVALUACION_AGENTE sin contestar) detiene el avance ahi -- lo de abajo
  // simplemente no aparece todavia. El sidebar es solo un atajo: si la
  // llamada se sale de contexto, el agente puede saltar a cualquier fase
  // para capturar algo fuera de orden, y despues volver al flujo normal
  // justo donde se habia quedado.

  function buildSidebar() {
    const fases = [];
    (state.data.preguntas || []).forEach(p => {
      if (p.Fase && !fases.includes(p.Fase)) fases.push(p.Fase);
    });
    state.fases = fases;
    state.modoCaptura = null;
    renderContent();
  }

  // La condicion de entrada de una fase completa se resuelve en codigo,
  // nunca como fila de Preguntas_ (ej. Servicios solo si CONFIG_PRODUCTS.Services = YES).
  function faseHabilitada(fase) {
    const key = normalizeKey(fase);
    if (key.indexOf('SERVICIO') !== -1) return esVerdadero(state.data.config.Services);
    return true;
  }

  function renderSidebarNav() {
    const sidebar = document.getElementById('sidebar');
    sidebar.innerHTML = '';
    const destacada = state.modoCaptura || faseActual();
    state.fases.filter(faseHabilitada).forEach(fase => {
      const btn = document.createElement('button');
      btn.className = 'nav-item' + (fase === destacada ? ' active' : '');
      btn.textContent = fase;
      btn.onclick = () => irAFaseFueraDeOrden(fase);
      sidebar.appendChild(btn);
    });
  }

  function irAFaseFueraDeOrden(fase) {
    state.modoCaptura = fase;
    renderContent();
  }

  function volverAlFlujo() {
    state.modoCaptura = null;
    renderContent();
  }

  // ---- Contenido: flujo continuo o captura fuera de orden ----

  function renderContent() {
    if (state.modoCaptura) renderCapturaFueraDeOrden();
    else renderFlujoContinuo();
  }

  function todasLasFilasVisibles() {
    return (state.data.preguntas || [])
      .filter(p => p.Fase && faseHabilitada(p.Fase) && tipoCategoria(p.Tipo) !== 'EVALUACION_CONTINUA')
      .sort((a, b) => {
        const fa = state.fases.indexOf(a.Fase), fb = state.fases.indexOf(b.Fase);
        if (fa !== fb) return fa - fb;
        return (Number(a.Orden) || 0) - (Number(b.Orden) || 0);
      })
      .filter(fila => cumpleMostrarSi(fila.Mostrar_Si));
  }

  // Solo PREGUNTA y EVALUACION_AGENTE detienen el avance -- son las que
  // capturan la eleccion de la que dependen los Mostrar_Si posteriores.
  function filaBloquea(fila) {
    const cat = tipoCategoria(fila.Tipo);
    if (cat === 'PREGUNTA' || cat === 'EVALUACION_AGENTE') {
      return state.respuestas[fila.Question_ID] === undefined;
    }
    return false;
  }

  // La fase "actual" es la de la primera pregunta pendiente -- o la ultima
  // fase si ya no queda ninguna (la llamada llego al final del guion).
  function faseActual() {
    const filas = todasLasFilasVisibles();
    for (let i = 0; i < filas.length; i++) {
      if (filaBloquea(filas[i])) return filas[i].Fase;
    }
    return state.fases[state.fases.length - 1];
  }

  function crearEncabezadoFase(fase) {
    const h = document.createElement('div');
    h.className = 'fase-header';
    h.textContent = fase;
    return h;
  }

  function renderFlujoContinuo() {
    const content = document.getElementById('content');
    content.innerHTML = '';
    const filas = todasLasFilasVisibles();

    let faseAnterior = null;
    let necesitaEvaluacion = false;
    let llegoAlFinal = true;

    for (let i = 0; i < filas.length; i++) {
      const fila = filas[i];
      if (fila.Fase !== faseAnterior) {
        content.appendChild(crearEncabezadoFase(fila.Fase));
        faseAnterior = fila.Fase;
      }

      const el = renderFila(fila);
      if (el) content.appendChild(el);

      if (tipoCategoria(fila.Tipo) === 'PANEL_INFO') {
        const sub = subtipoPanelInfo(fila);
        if (sub === 'CALIFICACION' || sub === 'FLAGS') necesitaEvaluacion = true;
      }

      if (filaBloquea(fila)) { llegoAlFinal = false; break; }
    }

    if (necesitaEvaluacion) evaluarYActualizarCheckpoint();

    // Solo se ofrece "Guardar llamada" cuando el flujo llego de verdad hasta
    // el final del guion (nada quedo bloqueando el avance en el camino).
    if (llegoAlFinal) renderCierreFinal(content);

    renderPanel();
    renderSidebarNav();
  }

  function renderCapturaFueraDeOrden() {
    const content = document.getElementById('content');
    content.innerHTML = '';

    const banner = document.createElement('div');
    banner.className = 'captura-banner';
    banner.innerHTML = '<strong>Captura fuera de orden:</strong> ' + escapeHtml(state.modoCaptura) +
      '. Contesta lo que necesites y vuelve al flujo normal.';
    content.appendChild(banner);

    const volverBtn = document.createElement('button');
    volverBtn.className = 'btn-mini';
    volverBtn.style.marginBottom = '18px';
    volverBtn.textContent = '← Volver al flujo';
    volverBtn.onclick = volverAlFlujo;
    content.appendChild(volverBtn);

    const filas = (state.data.preguntas || [])
      .filter(p => p.Fase === state.modoCaptura && tipoCategoria(p.Tipo) !== 'EVALUACION_CONTINUA')
      .sort((a, b) => (Number(a.Orden) || 0) - (Number(b.Orden) || 0))
      .filter(fila => cumpleMostrarSi(fila.Mostrar_Si));

    let necesitaEvaluacion = false;
    filas.forEach(fila => {
      const el = renderFila(fila);
      if (el) content.appendChild(el);
      if (tipoCategoria(fila.Tipo) === 'PANEL_INFO') {
        const sub = subtipoPanelInfo(fila);
        if (sub === 'CALIFICACION' || sub === 'FLAGS') necesitaEvaluacion = true;
      }
    });

    if (!filas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = 'No hay elementos para mostrar en esta fase todavía.';
      content.appendChild(vacio);
    }

    if (necesitaEvaluacion) evaluarYActualizarCheckpoint();

    renderPanel();
    renderSidebarNav();
  }

  function renderFila(fila) {
    switch (tipoCategoria(fila.Tipo)) {
      case 'SCRIPT': return renderScript(fila);
      case 'PREGUNTA': return renderPreguntaOCaptura(fila);
      case 'LIBRE': return renderLibre(fila);
      case 'CAMPO_PASIVO': return renderCampoPasivo(fila);
      case 'EVALUACION_AGENTE': return renderEvaluacionAgente(fila);
      case 'ACCION': return renderAccion(fila);
      case 'PANEL_INFO': return renderPanelInfoDispatch(fila);
      default: return null; // EVALUACION_CONTINUA (panel derecho) y tipos no reconocidos
    }
  }

  function renderAccion(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const btn = document.createElement('button');
    btn.className = 'action-btn';
    btn.textContent = fila['Script / Pregunta'] || fila.Question_ID || 'Ejecutar';
    btn.onclick = () => {
      if (fila.Question_ID) state.respuestas[fila.Question_ID] = 'EJECUTADO_' + new Date().toISOString();
      renderPanel();
    };
    div.appendChild(btn);
    return div;
  }

  function renderScript(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'script-text';
    box.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(box);
    return div;
  }

  // Cubre VERIFICACION / EXPLORATORIO / DISCOVERY / PREGUNTA / SONDEO.
  // Sin Opciones, es una captura abierta (misma UI que LIBRE).
  function renderPreguntaOCaptura(fila) {
    const opciones = separarOpciones(fila.Opciones);
    if (!opciones.length) return renderLibre(fila);

    const div = document.createElement('div');
    div.className = 'block';
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(q);

    const opts = document.createElement('div');
    opts.className = 'options';
    opciones.forEach(op => {
      const chip = document.createElement('button');
      chip.className = 'option-chip' + (state.respuestas[fila.Question_ID] === op ? ' selected' : '');
      chip.textContent = op;
      chip.onclick = () => { state.respuestas[fila.Question_ID] = op; renderContent(); };
      opts.appendChild(chip);
    });
    div.appendChild(opts);
    return div;
  }

  function renderLibre(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(q);

    const input = document.createElement('textarea');
    input.className = 'free-text';
    input.rows = 3;
    input.value = state.respuestas[fila.Question_ID] || '';
    input.oninput = () => { state.respuestas[fila.Question_ID] = input.value; renderPanel(); };
    div.appendChild(input);
    return div;
  }

  function renderCampoPasivo(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'passive-field';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = fila['Script / Pregunta'] || fila.Question_ID;
    box.appendChild(label);

    const input = document.createElement('input');
    input.type = 'text';
    input.className = 'free-text';
    input.placeholder = 'Se llena solo si surge...';
    input.value = state.respuestas[fila.Question_ID] || '';
    input.oninput = () => {
      state.respuestas[fila.Question_ID] = input.value;
      state.variables[normalizeKey(fila.Question_ID)] = input.value;
      renderPanel();
    };
    box.appendChild(input);
    div.appendChild(box);
    return div;
  }

  function renderEvaluacionAgente(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const q = document.createElement('div');
    q.className = 'question-text';
    q.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(q);

    const wrap = document.createElement('div');
    wrap.className = 'eval-agente';
    separarOpciones(fila.Opciones).forEach(op => {
      const color = colorDeTexto(op);
      const claseSel = color === 'red' ? 'sel-red' : color === 'orange' ? 'sel-orange' : color === 'green' ? 'sel-green' : '';
      const btn = document.createElement('button');
      btn.className = 'eval-btn' + (state.respuestas[fila.Question_ID] === op && claseSel ? ' ' + claseSel : '');
      btn.textContent = op;
      btn.onclick = () => { state.respuestas[fila.Question_ID] = op; renderContent(); };
      wrap.appendChild(btn);
    });
    div.appendChild(wrap);
    return div;
  }

  // PANEL_INFO agrupa 4 comportamientos que antes eran tipos separados. Como
  // ya no se distinguen por Tipo, se reconocen por el contenido fijo de su
  // propio texto (el de incidentes tambien tiene Question_ID poblado).
  function subtipoPanelInfo(fila) {
    if (fila.Question_ID === 'Q_INCIDENTES_RESUELTOS') return 'INCIDENTES';
    const texto = (fila['Script / Pregunta'] || '').toString().toLowerCase();
    if (texto.indexOf('calificacion sugerida') !== -1 || texto.indexOf('calificación sugerida') !== -1) return 'CALIFICACION';
    if (texto.indexOf('green flags') !== -1 && texto.indexOf('red flags') !== -1) return 'FLAGS';
    if (texto.indexOf('oportunidades identificadas') !== -1) return 'OPORTUNIDADES';
    return 'GENERICO';
  }

  function renderPanelInfoDispatch(fila) {
    switch (subtipoPanelInfo(fila)) {
      case 'INCIDENTES': return renderVerificacionPorIncidente(fila);
      case 'CALIFICACION': return renderCalificacionCalculada(fila);
      case 'FLAGS': return renderFlagsCalculados(fila);
      case 'OPORTUNIDADES': return renderPanelOportunidades(fila);
      default: return renderPanelGenerico(fila);
    }
  }

  function renderPanelGenerico(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const box = document.createElement('div');
    box.className = 'panel-info';
    box.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(box);
    return div;
  }

  function noEsSi(valor) {
    return (valor || '').toString().trim().toUpperCase() !== 'SI';
  }

  // Cuenta como oportunidad: Q_VIAJA_ASEGURADO != Si, Q_TRANSPORTE_RESUELTO != Si,
  // Q_INTERES_ACTIVIDADES = "Todavia no he pensado en eso".
  function renderPanelOportunidades(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = 'Oportunidades identificadas en esta llamada';
    div.appendChild(label);

    const oportunidades = [];
    if (noEsSi(state.respuestas.Q_VIAJA_ASEGURADO)) {
      oportunidades.push('No viaja asegurado -- ofrecer SafeKit/Propack.');
    }
    if (noEsSi(state.respuestas.Q_TRANSPORTE_RESUELTO)) {
      oportunidades.push('Transporte sin resolver -- ofrecer upgrade.');
    }
    if ((state.respuestas.Q_INTERES_ACTIVIDADES || '').toString().trim() === 'Todavia no he pensado en eso') {
      oportunidades.push('Sin actividades definidas -- ofrecer recomendaciones.');
    }

    const box = document.createElement('div');
    if (!oportunidades.length) {
      box.className = 'empty-state';
      box.textContent = 'Sin oportunidades detectadas -- se puede pasar directo a Cierre.';
    } else {
      box.className = 'panel-info';
      oportunidades.forEach(op => {
        const item = document.createElement('div');
        item.className = 'checklist-item';
        item.textContent = op;
        box.appendChild(item);
      });
    }
    div.appendChild(box);
    return div;
  }

  // ---- Incidentes (revision en vivo, subtipo PANEL_INFO/INCIDENTES) ----

  function renderVerificacionPorIncidente(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'question-text';
    label.innerHTML = interpolar(fila['Script / Pregunta'] || '');
    div.appendChild(label);

    const opcionesResolucion = separarOpciones(fila.Opciones);
    const lista = document.createElement('div');
    lista.id = 'lista-incidentes';
    div.appendChild(lista);
    renderListaIncidentes(opcionesResolucion);

    const addWrap = document.createElement('div');
    addWrap.className = 'options';
    addWrap.style.marginTop = '8px';
    const selInc = document.createElement('select');
    selInc.className = 'free-text';
    const vacio = document.createElement('option');
    vacio.value = '';
    vacio.textContent = 'Agregar incidente...';
    selInc.appendChild(vacio);
    (state.data.incidentesCatalogo || []).forEach(inc => {
      const opt = document.createElement('option');
      opt.value = inc.Incidente_ID;
      opt.textContent = inc.Incidente_ID + ' — ' + (inc.Descripcion || '');
      selInc.appendChild(opt);
    });
    selInc.onchange = () => {
      if (selInc.value) { agregarIncidente(selInc.value, opcionesResolucion); selInc.value = ''; }
    };
    addWrap.appendChild(selInc);
    div.appendChild(addWrap);
    return div;
  }

  function agregarIncidente(incidenteId, opcionesResolucion) {
    const def = (state.data.incidentesCatalogo || []).find(i => i.Incidente_ID === incidenteId);
    state.incidentes.push({
      Incidente_ID: incidenteId,
      Color: def ? def.Color_Sugerido : '',
      Resolucion: '',
      Pendiente: def ? def.Requiere_Seguimiento : ''
    });
    renderListaIncidentes(opcionesResolucion);
  }

  function quitarIncidente(index, opcionesResolucion) {
    state.incidentes.splice(index, 1);
    renderListaIncidentes(opcionesResolucion);
  }

  function renderListaIncidentes(opcionesResolucion) {
    const container = document.getElementById('lista-incidentes');
    if (!container) return;
    container.innerHTML = '';
    if (!state.incidentes.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = 'Sin incidentes registrados en esta llamada.';
      container.appendChild(vacio);
      return;
    }
    state.incidentes.forEach((inc, idx) => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      const texto = document.createElement('span');
      texto.textContent = inc.Incidente_ID + (inc.Color ? ' (' + inc.Color + ')' : '');
      item.appendChild(texto);

      (opcionesResolucion || []).forEach(op => {
        const chip = document.createElement('button');
        chip.className = 'option-chip' + (inc.Resolucion === op ? ' selected' : '');
        chip.textContent = op;
        chip.onclick = () => { inc.Resolucion = op; renderListaIncidentes(opcionesResolucion); };
        item.appendChild(chip);
      });

      const quitar = document.createElement('button');
      quitar.className = 'btn-mini btn-danger';
      quitar.textContent = 'Quitar';
      quitar.onclick = () => quitarIncidente(idx, opcionesResolucion);
      item.appendChild(quitar);
      container.appendChild(item);
    });
  }

  // ---- Checkpoint (Fase "Checkpoint - Evaluacion VLO": subtipos CALIFICACION + FLAGS) ----

  function renderCalificacionCalculada(fila) {
    state.filaCalificacion = fila;
    const div = document.createElement('div');
    div.className = 'checkpoint-card';
    div.id = 'calificacion-box';
    div.innerHTML = '<div class="empty-state">Evaluando reglas...</div>';
    return div;
  }

  function renderFlagsCalculados(fila) {
    const div = document.createElement('div');
    div.className = 'block';
    const label = document.createElement('div');
    label.className = 'block-label';
    label.textContent = fila['Script / Pregunta'] || 'Flags detectados';
    div.appendChild(label);
    const box = document.createElement('div');
    box.id = 'flags-content';
    box.className = 'empty-state';
    box.textContent = 'Evaluando...';
    div.appendChild(box);
    return div;
  }

  function evaluarYActualizarCheckpoint() {
    state.checkpointOverride = null;
    google.script.run.withSuccessHandler(mostrarCheckpoint).withFailureHandler(onError)
      .evaluarReglas(state.programa, state.respuestas);
  }

  function mostrarCheckpoint(reglasDisparadas) {
    state.reglasDisparadas = reglasDisparadas || [];
    const reglaGanadora = state.reglasDisparadas[0] || null;
    state.checkpointOverride = reglaGanadora ? reglaGanadora.Result : '';
    actualizarCajaCalificacion(reglaGanadora);
    actualizarCajaFlags();
  }

  function actualizarCajaCalificacion(reglaGanadora) {
    const box = document.getElementById('calificacion-box');
    if (!box) return;
    box.innerHTML = '';

    const colorMap = { green: 'var(--green)', orange: 'var(--orange)', red: 'var(--red)' };
    const badge = document.createElement('span');
    badge.className = 'result-badge';
    badge.style.background = colorMap[colorDeTexto(state.checkpointOverride)] || '#9aa4b2';
    badge.style.color = '#fff';
    badge.textContent = state.checkpointOverride || 'Sin regla disparada';
    box.appendChild(badge);

    if (reglaGanadora) {
      const razon = document.createElement('p');
      razon.innerHTML = '<strong>Razón interna:</strong> ' + escapeHtml(reglaGanadora.Internal_Reason || '');
      box.appendChild(razon);

      if (reglaGanadora.ESA_Validation && esVerdadero(reglaGanadora.ESA_Validation)) {
        const esa = document.createElement('p');
        esa.innerHTML = '<strong>Validación ESA:</strong> ' + escapeHtml(reglaGanadora.ESA_Validation);
        box.appendChild(esa);
      }
      if (reglaGanadora.Customer_Message) {
        const msg = document.createElement('div');
        msg.className = 'script-text';
        msg.innerHTML = interpolar(reglaGanadora.Customer_Message);
        box.appendChild(msg);
      }
      if (reglaGanadora.Next_Action) {
        const next = document.createElement('p');
        next.innerHTML = '<strong>Siguiente acción:</strong> ' + escapeHtml(reglaGanadora.Next_Action);
        box.appendChild(next);
      }
    } else {
      const sinRegla = document.createElement('p');
      sinRegla.className = 'empty-state';
      sinRegla.textContent = 'Ninguna regla se disparó con las respuestas actuales.';
      box.appendChild(sinRegla);
    }

    const ajusteLabel = document.createElement('div');
    ajusteLabel.className = 'block-label';
    ajusteLabel.style.marginTop = '14px';
    ajusteLabel.textContent = 'Confirmar o ajustar calificación';
    box.appendChild(ajusteLabel);

    const select = document.createElement('select');
    select.className = 'free-text';
    const opciones = separarOpciones(state.filaCalificacion ? state.filaCalificacion.Opciones : '');
    opciones.forEach(codigo => {
      const opt = document.createElement('option');
      opt.value = codigo;
      opt.textContent = codigo;
      if (codigo === state.checkpointOverride) opt.selected = true;
      select.appendChild(opt);
    });
    select.onchange = () => {
      state.checkpointOverride = select.value;
      actualizarCajaCalificacion(reglaGanadora);
    };
    box.appendChild(select);
  }

  // Solo se pueden calcular con certeza los flags que vienen de reglas con
  // Show_Alert -- los Green_Flag/Red_Flag descritos en Notes_[Programa] son
  // referencia para quien mantiene la hoja, no una condicion evaluable.
  function actualizarCajaFlags() {
    const box = document.getElementById('flags-content');
    if (!box) return;
    box.innerHTML = '';
    const conAlerta = (state.reglasDisparadas || []).filter(r => esVerdadero(r.Show_Alert));
    if (!conAlerta.length) {
      box.className = 'empty-state';
      box.textContent = 'Sin flags detectados.';
      return;
    }
    box.className = '';
    conAlerta.forEach(r => {
      const item = document.createElement('div');
      item.className = 'checklist-item';
      item.textContent = (r.Category || r.Rule_ID) + ': ' + (r.Internal_Reason || r.Result);
      box.appendChild(item);
    });
  }

  // ---- Panel derecho ----

  function renderPanel() {
    const panel = document.getElementById('right-panel');
    panel.innerHTML = '';

    const tituloEval = document.createElement('div');
    tituloEval.className = 'rp-title';
    tituloEval.textContent = 'Evaluación continua';
    panel.appendChild(tituloEval);

    const continuas = (state.data.preguntas || []).filter(p => tipoCategoria(p.Tipo) === 'EVALUACION_CONTINUA');
    if (!continuas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = 'Sin indicadores continuos.';
      panel.appendChild(vacio);
    }
    continuas.forEach(fila => {
      const opciones = separarOpciones(fila.Opciones).map(o => o.replace(/\s*\(default\)\s*/i, '').trim());
      if (!opciones.length) opciones.push('Verde');
      if (state.continuas[fila.Question_ID] === undefined) state.continuas[fila.Question_ID] = opciones[0];

      const row = document.createElement('div');
      row.className = 'rp-eval-row';
      const label = document.createElement('span');
      label.textContent = etiquetaCorta(fila.Question_ID);
      label.title = fila['Script / Pregunta'] || ''; // el texto largo de instrucciones queda en el tooltip
      const valorActual = state.continuas[fila.Question_ID];
      const dot = document.createElement('span');
      dot.className = 'dot dot-' + (colorDeTexto(valorActual) || colorPorNombre(valorActual));
      dot.style.cursor = 'pointer';
      dot.title = valorActual + ' -- click para cambiar';
      dot.onclick = () => {
        const idx = opciones.indexOf(state.continuas[fila.Question_ID]);
        state.continuas[fila.Question_ID] = opciones[(idx + 1) % opciones.length];
        state.respuestas[fila.Question_ID] = state.continuas[fila.Question_ID];
        renderPanel();
      };
      row.appendChild(label);
      row.appendChild(dot);
      panel.appendChild(row);
    });

    const tituloResumen = document.createElement('div');
    tituloResumen.className = 'rp-title';
    tituloResumen.style.marginTop = '18px';
    tituloResumen.textContent = 'Resumen en vivo';
    panel.appendChild(tituloResumen);

    const respondidas = Object.keys(state.respuestas).filter(k => state.respuestas[k] !== '' && state.respuestas[k] !== undefined);
    if (!respondidas.length) {
      const vacio = document.createElement('div');
      vacio.className = 'empty-state';
      vacio.textContent = 'Todavía no hay respuestas.';
      panel.appendChild(vacio);
    } else {
      respondidas.forEach(qid => {
        const fila = (state.data.preguntas || []).find(p => p.Question_ID === qid);
        const etiqueta = fila ? (fila['Script / Pregunta'] || qid) : qid;
        const item = document.createElement('div');
        item.className = 'checklist-item';
        item.textContent = etiqueta + ': ' + state.respuestas[qid];
        panel.appendChild(item);
      });
    }
  }

  // ---- Cierre (Fase 7: duracion + guardar) ----

  function renderCierreFinal(content) {
    const duracionLabel = document.createElement('div');
    duracionLabel.className = 'block-label';
    duracionLabel.style.marginTop = '18px';
    duracionLabel.textContent = 'Duración de la llamada (minutos)';
    content.appendChild(duracionLabel);

    const duracionInput = document.createElement('input');
    duracionInput.type = 'number';
    duracionInput.min = '0';
    duracionInput.className = 'free-text';
    duracionInput.value = calcularDuracionMinutos();
    content.appendChild(duracionInput);

    const guardarBtn = document.createElement('button');
    guardarBtn.className = 'action-btn';
    guardarBtn.style.marginTop = '12px';
    guardarBtn.textContent = 'Guardar llamada';
    guardarBtn.onclick = () => finalizarLlamada(duracionInput.value);
    content.appendChild(guardarBtn);
  }

  function calcularDuracionMinutos() {
    if (!state.startTime) return 0;
    return Math.round((Date.now() - state.startTime) / 60000);
  }

  function finalizarLlamada(duracionMinutos) {
    const flags = (state.reglasDisparadas || [])
      .filter(r => esVerdadero(r.Show_Alert))
      .map(r => r.Rule_ID)
      .join(', ');

    const datos = {
      programa: state.programa,
      contrato: state.contrato,
      cliente: state.cliente,
      agente: state.agente,
      duracion: duracionMinutos,
      calificacionFinal: state.checkpointOverride || '',
      flags: flags,
      respuestas: state.respuestas,
      incidentes: state.incidentes
    };

    google.script.run.withSuccessHandler(resp => {
      if (resp === 'OK') {
        alert('Llamada guardada correctamente.');
        location.reload();
      } else {
        alert('Hubo un problema al guardar: ' + resp);
      }
    }).withFailureHandler(onError).guardarLlamada(datos);
  }

  // ---- Topbar: contrato / cliente ----

  function onContratoChange(valor) {
    state.contrato = valor;
    state.variables['CONTRATO'] = valor;
  }

  function onVariableChange(key, value) {
    const normKey = normalizeKey(key);
    state.variables[normKey] = value;
    if (normKey === 'CLIENT_NAME') state.cliente = value;
    if (state.data && state.fases.length) renderContent();
  }

  function buscarHistorico() {
    const contrato = document.getElementById('tb-contrato').value.trim();
    if (!contrato) { alert('Escribe un número de contrato para buscar.'); return; }
    google.script.run.withSuccessHandler(mostrarHistorico).withFailureHandler(onError).buscarContratoHistorico(contrato);
  }

  function mostrarHistorico(resultado) {
    if (!resultado) { alert('No se encontró historial para ese contrato.'); return; }
    if (typeof resultado === 'string') { alert(resultado); return; }
    const r = resultado.registro;
    let texto = 'Última llamada registrada:\n' +
      'Fecha: ' + r.Fecha + '\nPrograma: ' + r.Programa + '\nAgente: ' + r.Agente +
      '\nCalificación: ' + r.Calificacion_Final + '\nIncidentes: ' + r.Num_Incidentes;
    if (resultado.incidentes && resultado.incidentes.length) {
      texto += '\n\nIncidentes registrados:\n' +
        resultado.incidentes.map(i => '- ' + i.Incidente_ID + ' (' + i.Color + ')').join('\n');
    }
    alert(texto);
  }
</script>
