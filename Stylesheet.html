<style>
  :root {
    --ink: #1a202c;
    --accent: #2563eb;
    --border: #e5e7eb;
    --bg-soft: #f8fafc;
    --muted: #64748b;
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; color: var(--ink); background:#fff; }

  /* Lock screen */
  .lock-screen { position:fixed; inset:0; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; }
  .lock-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:28px; width:320px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .lock-card h2 { margin:0 0 18px; font-size:18px; }
  .lock-card label { display:block; font-size:11px; text-transform:uppercase; color:var(--muted); margin:12px 0 4px; }
  .lock-card select, .lock-card input, .lock-card button { width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); font-family:inherit; font-size:13px; box-sizing:border-box; }
  .lock-card button { margin-top:18px; background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  .lock-idioma { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
  .lock-idioma button { width:auto; margin-top:0; padding:4px 10px; background:var(--bg-soft); color:var(--muted); border:1px solid var(--border); font-weight:600; }

  /* Topbar */
  .topbar { display:flex; gap:18px; align-items:center; padding:10px 20px; background:var(--ink); color:#fff; flex-wrap:wrap; position:sticky; top:0; z-index:10; }
  .topbar-field { display:flex; align-items:center; gap:6px; font-size:12px; }
  .tb-label { color:#9aa4b2; text-transform:uppercase; font-size:10px; }
  .topbar input { font-family:inherit; font-size:12px; padding:5px 8px; border-radius:6px; border:1px solid #3a4356; background:#242c3a; color:#fff; }
  .btn-mini { padding:5px 10px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:11px; cursor:pointer; font-family:inherit; }
  .btn-mini.idioma-activo { background:#fff; color:var(--ink); font-weight:700; }
  .btn-danger { background:#7f1d1d; margin-left:auto; }

  /* align-items:flex-start evita que el flex estire sidebar/right-panel a la
     altura del contenido -- eso es lo que permite que el sticky funcione: se
     quedan fijos en la ventana mientras el contenido central hace scroll. */
  .body-grid { display:flex; align-items:flex-start; }
  .sidebar { width:230px; flex-shrink:0; background:var(--bg-soft); border-right:1px solid var(--border); padding:16px 10px; position:sticky; top:46px; height:calc(100vh - 46px); overflow-y:auto; }
  .nav-item { display:block; width:100%; text-align:left; padding:9px 12px; border-radius:8px; border:none; background:transparent; font-size:12.5px; cursor:pointer; font-family:inherit; margin-bottom:2px; }
  .nav-item:hover { background:#eef2f7; }
  .nav-item.active { background:var(--accent); color:#fff; font-weight:600; }
  .nav-subitem { display:block; width:100%; text-align:left; padding:5px 10px 5px 22px; border-radius:6px; border:none; background:transparent; font-size:11px; color:var(--muted); cursor:pointer; font-family:inherit; margin-bottom:1px; line-height:1.35; }
  .nav-subitem:hover { background:#eef2f7; color:var(--ink); }
  .nav-subitem.contestada { text-decoration:line-through; color:#9aa4b2; }

  .content { flex:1; padding:26px 34px; max-width:680px; }
  .right-panel { width:290px; flex-shrink:0; border-left:1px solid var(--border); background:var(--bg-soft); padding:18px 16px; position:sticky; top:46px; height:calc(100vh - 46px); overflow-y:auto; }

  .progreso-wrap { background:#e2e8f0; border-radius:999px; height:8px; overflow:hidden; margin-bottom:4px; }
  .progreso-barra { background:var(--accent); height:100%; border-radius:999px; transition:width .2s ease; }
  .progreso-texto { font-size:11px; color:var(--muted); margin-bottom:16px; }

  .block { margin-bottom:20px; }
  .block-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; }
  .script-text { background:var(--bg-soft); border-left:3px solid var(--accent); padding:12px 14px; border-radius:6px; font-size:13.5px; line-height:1.55; }
  .question-text { font-size:14.5px; font-weight:600; margin-bottom:9px; }
  .options { display:flex; flex-wrap:wrap; gap:7px; }
  .option-chip { padding:7px 13px; border-radius:999px; border:1.5px solid var(--border); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .option-chip.selected { border-color:var(--accent); background:#eaf1fd; color:var(--accent); font-weight:600; }
  .free-text { width:100%; padding:9px 11px; border-radius:8px; border:1.5px solid var(--border); font-family:inherit; font-size:13px; }
  .passive-field { border:1px dashed var(--border); border-radius:8px; padding:10px 12px; background:#fafafa; }
  .eval-agente { display:flex; gap:8px; }
  .eval-btn { flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--border); background:#fff; cursor:pointer; font-family:inherit; font-size:12px; }
  .eval-btn.sel-green { background:#dcfce7; border-color:var(--green); }
  .eval-btn.sel-orange { background:#ffedd5; border-color:var(--orange); }
  .eval-btn.sel-red { background:#fee2e2; border-color:var(--red); }
  .action-btn { padding:11px 16px; border-radius:8px; border:none; background:var(--ink); color:#fff; font-weight:600; cursor:pointer; font-family:inherit; font-size:13px; }
  .panel-info { font-size:12.5px; background:#eef2f7; border-radius:8px; padding:10px 12px; }
  .var-missing { color: var(--red); font-style: italic; }

  /* right panel */
  .rp-title { font-size:10.5px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .rp-eval-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-green{background:var(--green);} .dot-orange{background:var(--orange);} .dot-red{background:var(--red);}
  .checklist-item { font-size:12px; padding:5px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .empty-state { font-size:12px; color:var(--muted); font-style:italic; }
  .punto-critico-ok { color:var(--green); font-weight:700; }
  .punto-critico-pendiente { color:var(--orange); font-weight:700; }
  .flag-item.flag-green { color:var(--green); }
  .flag-item.flag-red { color:var(--red); }
  .hotel-tips-list { margin:0; padding-left:18px; font-size:12px; line-height:1.5; }
  .hotel-tips-list li { margin-bottom:6px; }

  .checkpoint-card { border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .result-badge { display:inline-block; padding:5px 10px; border-radius:6px; font-weight:600; font-size:13px; }

  /* Flujo continuo: divisor de fase dentro de la columna, y aviso de captura fuera de orden */
  .fase-header { margin:28px 0 14px; padding-top:14px; border-top:2px solid var(--border); font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
  .fase-header:first-child { margin-top:0; padding-top:0; border-top:none; }
  .captura-banner { background:#fff7ed; border:1px solid var(--orange); border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:12.5px; }
</style>
