<style>
  :root {
    --ink: #1a202c;
    --accent: #2563eb;
    --border: #e5e7eb;
    --bg-soft: #f8fafc;
    --muted: #64748b;
    --green: #16a34a;
    --orange: #d97706;
    --red: #dc2626;
    /* Identidad de color de las 3 categorias de notas (VLO/MKT/RED) en la
       pantalla de Finalizar llamada -- "RED" es un departamento (Reservas/
       Retencion), no el color de alerta, por eso usa violeta y no --red. */
    --nota-vlo: #2563eb;
    --nota-mkt: #0d9488;
    --nota-red: #7c3aed;
    /* El topbar tiene varios campos y puede envolver a 2 lineas segun el
       ancho de ventana o el idioma -- ajustarAltoTopbar() en JavaScript.html
       mide su alto real y actualiza esta variable, para que el sidebar y el
       panel derecho nunca queden tapados ni con un hueco debajo del topbar. */
    --topbar-alto: 58px;
  }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; color: var(--ink); background:#fff; }

  /* Lock screen */
  .lock-screen { position:fixed; inset:0; background:var(--bg-soft); display:flex; align-items:center; justify-content:center; }
  .lock-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:28px; width:320px; box-shadow:0 4px 20px rgba(0,0,0,.06); }
  .lock-card h2 { margin:0 0 18px; font-size:18px; }
  .lock-card label { display:block; font-size:11px; text-transform:uppercase; color:var(--muted); margin:12px 0 4px; }
  .lock-card select, .lock-card input, .lock-card button { width:100%; padding:9px; border-radius:8px; border:1px solid var(--border); font-family:inherit; font-size:13px; box-sizing:border-box; }
  .lock-card button { margin-top:18px; background:var(--accent); color:#fff; border:none; font-weight:600; cursor:pointer; }
  .lock-idioma { display:flex; gap:6px; justify-content:flex-end; margin-bottom:8px; }
  .lock-idioma button { width:auto; margin-top:0; padding:4px 10px; background:var(--bg-soft); color:var(--muted); border:1px solid var(--border); font-weight:600; }
  .lock-paso { display:none; }
  .lock-paso.activo { display:block; }

  /* Topbar -- position:sticky con top:0 lo mantiene siempre visible (no hay
     nada por encima que lo empuje), efecto identico a position:fixed en este
     layout pero sin sacarlo del flujo. Mas aire que antes (padding/gap/
     tamaños mas grandes) y una sombra que lo separa visualmente del
     contenido, para que se note que quedo fijo al hacer scroll. */
  .topbar { display:flex; gap:22px; align-items:center; padding:14px 26px; background:var(--ink); color:#fff; flex-wrap:wrap; position:sticky; top:0; z-index:10; box-shadow:0 2px 8px rgba(0,0,0,.18); }
  .topbar-field { display:flex; align-items:center; gap:7px; font-size:13px; }
  .tb-label { color:#9aa4b2; text-transform:uppercase; font-size:10.5px; }
  .topbar input { font-family:inherit; font-size:13px; padding:6px 9px; border-radius:6px; border:1px solid #3a4356; background:#242c3a; color:#fff; }
  .btn-mini { padding:6px 12px; border-radius:6px; border:none; background:var(--accent); color:#fff; font-size:11.5px; cursor:pointer; font-family:inherit; }
  .btn-mini.idioma-activo { background:#fff; color:var(--ink); font-weight:700; }
  .btn-danger { background:#7f1d1d; margin-left:auto; }
  .tb-duracion { font-variant-numeric:tabular-nums; font-weight:600; }
  .tb-progreso-mini { display:flex; align-items:center; gap:7px; }
  .tb-progreso-barra-wrap { width:70px; background:#3a4356; border-radius:999px; height:6px; overflow:hidden; }
  .tb-progreso-barra { background:var(--accent); height:100%; border-radius:999px; transition:width .2s ease; }

  /* align-items:flex-start evita que el flex estire sidebar/right-panel a la
     altura del contenido -- eso es lo que permite que el sticky funcione: se
     quedan fijos en la ventana mientras el contenido central hace scroll.
     El offset --topbar-alto (ver :root) los mantiene justo debajo del
     topbar sin importar si este ocupa una o dos lineas. */
  .body-grid { display:flex; align-items:flex-start; }
  .sidebar { width:220px; flex-shrink:0; background:#fff; border-right:1px solid var(--border); padding:18px 12px; position:sticky; top:var(--topbar-alto); max-height:calc(100vh - var(--topbar-alto)); overflow-y:auto; }
  .nav-item { display:block; width:100%; text-align:left; padding:10px 12px; border-radius:8px; border:none; border-left:3px solid transparent; background:transparent; font-size:12.5px; font-weight:700; letter-spacing:.02em; text-transform:uppercase; color:var(--muted); cursor:pointer; font-family:inherit; margin-bottom:2px; }
  .nav-item:hover { background:var(--bg-soft); color:var(--ink); }
  .nav-item.active { background:#eaf1fd; border-left-color:var(--accent); color:var(--accent); }
  .nav-subitem { display:block; width:100%; text-align:left; padding:6px 10px 6px 20px; border-radius:6px; border:none; background:transparent; font-size:11.5px; color:var(--muted); cursor:pointer; font-family:inherit; margin-bottom:1px; line-height:1.4; }
  .nav-subitem:hover { background:var(--bg-soft); color:var(--ink); }
  .nav-subitem.contestada { text-decoration:line-through; color:#c3cbd6; }

  .content { flex:1; padding:30px 40px; max-width:760px; }
  .right-panel { width:240px; flex-shrink:0; border-left:1px solid var(--border); background:var(--bg-soft); padding:18px 14px; position:sticky; top:var(--topbar-alto); max-height:calc(100vh - var(--topbar-alto)); overflow-y:auto; }

  .block { margin-bottom:20px; }
  .block-label { font-size:10.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--muted); margin-bottom:6px; }
  /* Identidad propia para el guion (lo que el agente lee en voz alta) --
     antes era el mismo gris plano de otros bloques informativos; ahora un
     tinte azul y un borde mas grueso lo distinguen de un vistazo del resto
     del contenido (preguntas, paneles, etc). */
  .script-text { background:#eff6ff; border-left:5px solid var(--accent); padding:14px 16px; border-radius:6px; font-size:14px; line-height:1.6; }
  .question-text { font-size:14.5px; font-weight:600; margin-bottom:9px; }
  .options { display:flex; flex-wrap:wrap; gap:7px; }
  .option-chip { padding:7px 13px; border-radius:999px; border:1.5px solid var(--border); background:#fff; font-size:12.5px; cursor:pointer; font-family:inherit; }
  .option-chip.selected { border-color:var(--accent); background:#eaf1fd; color:var(--accent); font-weight:600; }
  .free-text { width:100%; padding:9px 11px; border-radius:8px; border:1.5px solid var(--border); font-family:inherit; font-size:13px; }
  .passive-field { border:1px dashed var(--border); border-radius:8px; padding:10px 12px; background:#fafafa; }
  .eval-agente { display:flex; gap:8px; }
  .eval-btn { flex:1; padding:8px; border-radius:8px; border:1.5px solid var(--border); background:#fff; cursor:pointer; font-family:inherit; font-size:12px; }
  .eval-btn.sel-green { background:#dcfce7; border-color:var(--green); }
  .eval-btn.sel-orange { background:#ffedd5; border-color:var(--orange); }
  .eval-btn.sel-red { background:#fee2e2; border-color:var(--red); }
  .action-btn { padding:11px 16px; border-radius:8px; border:none; background:var(--ink); color:#fff; font-weight:600; cursor:pointer; font-family:inherit; font-size:13px; }
  .panel-info { font-size:12.5px; background:#eef2f7; border-radius:8px; padding:10px 12px; }
  .var-missing { color: var(--red); font-style: italic; }

  /* right panel */
  .rp-title { font-size:10.5px; text-transform:uppercase; color:var(--muted); margin:0 0 8px; }
  .rp-eval-row { display:flex; justify-content:space-between; align-items:center; font-size:12px; padding:6px 0; border-bottom:1px solid var(--border); }
  .dot { width:9px; height:9px; border-radius:50%; display:inline-block; }
  .dot-green{background:var(--green);} .dot-orange{background:var(--orange);} .dot-red{background:var(--red);}
  .checklist-item { font-size:12px; padding:5px 0; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .empty-state { font-size:12px; color:var(--muted); font-style:italic; }
  .punto-critico-ok { color:var(--green); font-weight:700; }
  .punto-critico-pendiente { color:var(--orange); font-weight:700; }
  .flag-item.flag-green { color:var(--green); }
  .flag-item.flag-red { color:var(--red); }
  .hotel-tips-list { margin:0; padding-left:18px; font-size:12px; line-height:1.5; }
  .hotel-tips-list li { margin-bottom:6px; }

  .checkpoint-card { border:1px solid var(--border); border-radius:10px; padding:16px; margin-bottom:14px; }
  .result-badge { display:inline-block; padding:5px 10px; border-radius:6px; font-weight:600; font-size:13px; }

  /* Flujo continuo: divisor de fase dentro de la columna, y aviso de captura fuera de orden */
  .fase-header { margin:28px 0 14px; padding-top:14px; border-top:2px solid var(--border); font-size:12px; font-weight:700; color:var(--accent); text-transform:uppercase; letter-spacing:.04em; }
  .fase-header:first-child { margin-top:0; padding-top:0; border-top:none; }
  .captura-banner { background:#fff7ed; border:1px solid var(--orange); border-radius:8px; padding:10px 14px; margin-bottom:10px; font-size:12.5px; }

  /* Modal propio -- reemplaza alert()/confirm() nativos del navegador (feos
     y, en el caso de confirm(), bloqueantes de un modo que no combina bien
     con el iframe sandboxeado de Apps Script). Un solo componente para
     mensaje simple (1 boton) o confirmacion (2 botones). */
  .modal-overlay { position:fixed; inset:0; background:rgba(15,23,42,.45); display:flex; align-items:center; justify-content:center; z-index:100; }
  .modal-card { background:#fff; border-radius:12px; padding:22px 24px; width:340px; max-width:calc(100vw - 32px); box-shadow:0 12px 32px rgba(0,0,0,.22); }
  .modal-mensaje { font-size:13.5px; line-height:1.55; white-space:pre-line; color:var(--ink); margin-bottom:18px; }
  .modal-acciones { display:flex; justify-content:flex-end; gap:8px; }
  .modal-acciones .btn-mini { padding:8px 16px; font-size:12.5px; background:var(--bg-soft); color:var(--ink); border:1px solid var(--border); }
  .modal-acciones .btn-mini.modal-btn-primario { background:var(--accent); color:#fff; border-color:var(--accent); font-weight:600; }

  /* Notas de Finalizar llamada -- tarjetas de 3 columnas con identidad de
     color por categoria (opcion A aprobada). El boton Copiar vive dentro
     del header de color en vez de debajo del texto. */
  .notas-grid { display:grid; grid-template-columns:repeat(3, 1fr); gap:14px; margin-bottom:18px; }
  .nota-card { border-radius:10px; overflow:hidden; border:1px solid var(--border); display:flex; flex-direction:column; }
  .nota-card-header { padding:10px 14px; display:flex; align-items:center; justify-content:space-between; color:#fff; font-weight:700; font-size:12px; letter-spacing:.03em; text-transform:uppercase; }
  .nota-card.vlo .nota-card-header { background:var(--nota-vlo); }
  .nota-card.mkt .nota-card-header { background:var(--nota-mkt); }
  .nota-card.red .nota-card-header { background:var(--nota-red); }
  .nota-card-copy { background:rgba(255,255,255,.18); border:none; color:#fff; border-radius:6px; padding:4px 9px; font-size:11px; cursor:pointer; font-family:inherit; }
  .nota-card-copy:hover { background:rgba(255,255,255,.3); }
  .nota-card-body { padding:12px 14px; font-size:12.5px; line-height:1.6; flex:1; white-space:pre-line; min-height:90px; }
  .nota-card.vlo .nota-card-body { background:#eff6ff; }
  .nota-card.mkt .nota-card-body { background:#f0fdfa; }
  .nota-card.red .nota-card-body { background:#f5f3ff; }
  .nota-card-body.vacio { color:var(--muted); font-style:italic; }
  @media (max-width: 620px) { .notas-grid { grid-template-columns:1fr; } }
</style>
