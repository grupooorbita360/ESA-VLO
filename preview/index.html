<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ESA-VLO -- Visor local (sin Apps Script)</title>
  <!--
    Visor de prueba local. NO forma parte del proyecto de Apps Script
    (Apps Script ignora cualquier carpeta llamada "preview"). Sirve para
    probar cambios de JavaScript.html/Stylesheet.html en un navegador
    normal, sin copiar nada al editor y sin tocar el Sheet real.

    Como usarlo:
      1. Desde la raiz del repo: python3 -m http.server 8000
         (tiene que ser server; abrir el archivo directo con file:// no
         funciona porque el navegador bloquea el fetch() de abajo)
      2. Abrir http://localhost:8000/preview/ en el navegador.
      3. Editar JavaScript.html o Stylesheet.html y recargar la pagina --
         este visor los lee en vivo, no hay build ni copia de por medio.

    Los datos que ves aqui (agentes, preguntas, reglas) son de PRUEBA,
    inventados en mock-data.js -- no es el guion real de ningun programa.
    Esto prueba la mecanica de la app (flujo, panel fijo, progreso,
    Checkpoint, Mostrar_Si); la validacion final siempre es contra el
    Sheet real desde Apps Script.
  -->
  <style id="estilos-reales"><!-- se llena en vivo desde Stylesheet.html --></style>
  <style>
    .aviso-preview { position:fixed; bottom:0; left:0; right:0; background:#1a202c; color:#fbbf24; font:12px monospace; padding:6px 14px; z-index:9999; text-align:center; }
  </style>
</head>
<body>

  <div id="lock-screen" class="lock-screen">
    <div class="lock-card">
      <div class="lock-idioma">
        <button class="btn-mini" id="btn-idioma-es-lock" onclick="cambiarIdioma('ES')">ES</button>
        <button class="btn-mini" id="btn-idioma-en-lock" onclick="cambiarIdioma('EN')">EN</button>
      </div>
      <h2>Verification Copilot (visor local)</h2>

      <div class="lock-paso activo" id="lock-paso-1">
        <label data-i18n="labelAgente">Agente</label>
        <select id="sel-agente"><option value="">Cargando...</option></select>
        <button onclick="avanzarPaso1()" data-i18n="btnEntrar">Entrar</button>
      </div>

      <div class="lock-paso" id="lock-paso-2">
        <label data-i18n="labelPrograma">Programa</label>
        <select id="sel-programa"><option value="">Cargando...</option></select>
        <button onclick="avanzarPaso2()" data-i18n="btnContinuar">Continuar</button>
      </div>

      <div class="lock-paso" id="lock-paso-3">
        <label data-i18n="labelContrato">Contrato</label>
        <input id="lock-contrato" type="text" data-i18n-placeholder="placeholderContrato" value="DEMO-0001">
        <label data-i18n="labelCliente">Cliente</label>
        <input id="lock-cliente" type="text" data-i18n-placeholder="placeholderCliente" value="Cliente de Prueba">
        <label data-i18n="labelHotel">Hotel</label>
        <input id="lock-hotel" type="text" data-i18n-placeholder="placeholderHotel">
        <button id="btn-iniciar" onclick="iniciar()" data-i18n="btnEmpezarLlamada">Empezar llamada</button>
      </div>
    </div>
  </div>

  <div id="app" class="app" style="display:none;">
    <header class="topbar">
      <div class="topbar-field"><span class="tb-label" data-i18n="labelAgente">Agente</span><span id="tb-agente">--</span></div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelPrograma">Programa</span><span id="tb-programa">--</span></div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelContrato">Contrato</span>
        <input id="tb-contrato" type="text" data-i18n-placeholder="placeholderContratoTopbar" oninput="onContratoChange(this.value)">
        <button class="btn-mini" onclick="buscarHistorico()" data-i18n="btnBuscar">Buscar</button>
      </div>
      <div class="topbar-field"><span class="tb-label" data-i18n="labelCliente">Cliente</span>
        <input id="tb-cliente" type="text" oninput="onVariableChange('CLIENT_NAME', this.value)">
      </div>
      <div class="topbar-field">
        <button class="btn-mini" id="btn-idioma-es" onclick="cambiarIdioma('ES')">ES</button>
        <button class="btn-mini" id="btn-idioma-en" onclick="cambiarIdioma('EN')">EN</button>
      </div>
      <button class="btn-mini btn-danger" onclick="reiniciar()" data-i18n="btnReiniciar">Reiniciar</button>
    </header>

    <div class="body-grid">
      <aside class="sidebar" id="sidebar"></aside>
      <main class="content" id="content"></main>
      <aside class="right-panel" id="right-panel"></aside>
    </div>
  </div>

  <div class="aviso-preview">VISOR LOCAL -- datos de prueba, no es el Sheet real</div>

  <script>
    // Todo se lee con cache:'no-store' -- sin esto, el navegador puede seguir
    // sirviendo una version vieja de mock-data.js/Stylesheet.html/JavaScript.html
    // aunque el archivo en disco ya cambio, y el visor parece "no reflejar" un
    // cambio que en realidad si esta en el repo (recargar la pestaña no basta
    // si el navegador cree que el recurso todavia es valido).
    async function leerSinCache(url) {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error('No se pudo leer ' + url + ' (¿estas sirviendo por http:// y no abriendo el archivo directo?)');
      return resp.text();
    }

    async function extraerContenido(url, etiqueta) {
      const texto = await leerSinCache(url);
      const regex = new RegExp('<' + etiqueta + '[^>]*>([\\s\\S]*)</' + etiqueta + '>');
      const m = texto.match(regex);
      if (!m) throw new Error(etiqueta + ' no encontrado en ' + url);
      return m[1];
    }

    (async () => {
      try {
        const mock = await leerSinCache('mock-data.js');
        const scriptMock = document.createElement('script');
        scriptMock.textContent = mock;
        document.body.appendChild(scriptMock);

        const css = await extraerContenido('../Stylesheet.html', 'style');
        document.getElementById('estilos-reales').textContent = css;

        const js = await extraerContenido('../JavaScript.html', 'script');
        const scriptReal = document.createElement('script');
        scriptReal.textContent = js;
        document.body.appendChild(scriptReal); // se ejecuta al insertarse, dispara DOMContentLoaded ya paso -> lo disparamos manual abajo
        document.dispatchEvent(new Event('DOMContentLoaded'));
      } catch (e) {
        document.body.innerHTML = '<pre style="padding:24px;color:#dc2626;">' + e.message + '</pre>';
      }
    })();
  </script>
</body>
</html>
